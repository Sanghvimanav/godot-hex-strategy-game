name: Trigger Neural Policy Iteration 3

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/neural-policy-iteration-3-trigger.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch neural-policy iteration 3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/workflows/neural-policy-followup.yml/dispatches" \
            -d '{"ref":"main","inputs":{"source_experiment_run_id":"34152473442","checkpoint_run_id":"34240515308","arena_run_id":"34240515308","arena_artifact_pattern":"neural-policy-arena-shard-*","policy_preset":"fast","search_profile":"balanced","max_sibling_decisions":"16","max_arena_divergences_per_game":"2","epochs":"60"}}'
