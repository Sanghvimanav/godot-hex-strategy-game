name: Phase One Candidate

on:
  workflow_dispatch:
  push:
    branches: [ai/phase-one-goal]
    paths: [.github/phase-one-trigger]

permissions:
  contents: read
  actions: read

concurrency:
  group: phase-one-${{ github.ref }}
  cancel-in-progress: false

env:
  PARENT_RUN: '34715462406'
  RULES_VERSION: '9509cec4d018ad97fc05cb959647303bb1f4add7'
  GODOT_VERSION: '4.6.0'

jobs:
  train:
    name: Reuse unchanged experiment 3 checkpoint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: phase-one-candidate
          path: artifacts/candidate
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ env.PARENT_RUN }}
      - name: Verify checkpoint and record ablation provenance
        run: |
          python - <<'PY'
          import datetime, hashlib, json, os, pathlib, sys, urllib.request
          sys.path.insert(0, 'hex-strategy-game/tools')
          from prepare_phase_one_ablation import ablation_provenance
          url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          run = json.load(urllib.request.urlopen(url))
          start = datetime.datetime.fromisoformat(run['created_at'].replace('Z', '+00:00'))
          setup = (datetime.datetime.now(datetime.timezone.utc) - start).total_seconds()
          checkpoint = pathlib.Path('artifacts/candidate/candidate/ranked_value_model.pt')
          provenance = checkpoint.with_name('training_provenance.json')
          source = json.loads(provenance.read_text())
          report = ablation_provenance(source, hashlib.sha256(checkpoint.read_bytes()).hexdigest(),
                                      os.environ['RULES_VERSION'], setup, os.environ['PARENT_RUN'])
          report['ablation_checkout_version'] = os.environ['GITHUB_SHA']
          report['experiment_run'] = os.environ['GITHUB_RUN_ID']
          provenance.write_text(json.dumps(report, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase-one-candidate
          path: artifacts/candidate/
          retention-days: 30

  evaluate:
    needs: train
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        group: [familiar, unfamiliar]
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - uses: actions/download-artifact@v4
        with:
          name: phase-one-candidate
          path: artifacts/candidate
      - uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: false
      - name: Import
        working-directory: hex-strategy-game
        run: godot --headless --editor --import --quit
      - name: Frozen mirrored evaluation
        working-directory: hex-strategy-game
        env:
          MAP_GROUP: ${{ matrix.group }}
        run: |
          map_profile=compact_v1
          if [[ "$MAP_GROUP" == unfamiliar ]]; then map_profile=phase1_unfamiliar_v1; fi
          godot --headless --path . res://tools/ai_arena.tscn -- \
            --preset="phase1_$MAP_GROUP" --map-profile="$map_profile" \
            --champion-profile=broad --challenger-profile=broad \
            --champion-evaluator=handwritten --challenger-evaluator=neural \
            --decision-time-budget-ms=25000 --runner-type=ubuntu-latest \
            --learned-proposals=false \
            --checkpoint="$GITHUB_WORKSPACE/artifacts/candidate/candidate/ranked_value_model.pt" \
            --rules-version="$RULES_VERSION" --shard-index=${{ matrix.shard }} --shard-count=4 \
            --out="$GITHUB_WORKSPACE/artifacts/evaluation"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase-one-${{ matrix.group }}-${{ matrix.shard }}
          path: artifacts/evaluation/
          retention-days: 30

  report:
    needs: evaluate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: phase-one-familiar-*
          path: artifacts/familiar
      - uses: actions/download-artifact@v4
        with:
          pattern: phase-one-unfamiliar-*
          path: artifacts/unfamiliar
      - uses: actions/download-artifact@v4
        with:
          name: phase-one-candidate
          path: artifacts/candidate
      - name: Merge and check Phase 1 gates
        run: |
          python hex-strategy-game/tools/merge_ai_arena.py --input-root artifacts/familiar --out artifacts/merged/familiar
          python hex-strategy-game/tools/merge_ai_arena.py --input-root artifacts/unfamiliar --out artifacts/merged/unfamiliar
          python ml/value_model/phase_one_gate.py \
            --familiar artifacts/merged/familiar/manifest.json \
            --unfamiliar artifacts/merged/unfamiliar/manifest.json \
            --training artifacts/candidate/candidate/training_provenance.json \
            --output artifacts/phase_one_report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase-one-report
          path: |
            artifacts/phase_one_report.json
            artifacts/merged/
          retention-days: 30
