name: Godot Tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Headless test suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Godot 4.6
        uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: 4.6.0
          use-dotnet: false
          include-templates: false

      - name: Verify Godot version
        run: godot --version

      - name: Import project
        working-directory: hex-strategy-game
        run: godot --headless --import

      - name: Run headless test suite
        working-directory: hex-strategy-game
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . res://tests/test_runner.tscn 2>&1 | tee test-output.log

      - name: Smoke-test 2x2 search-decision export
        shell: bash
        run: |
          set -euo pipefail
          OUT="${GITHUB_WORKSPACE}/artifacts/search-decision-smoke"
          cd hex-strategy-game

          # The smoke preset is a one-turn game and should finish quickly. The
          # integration path is the reliable compile/runtime check because standalone
          # --check-only scripts do not load this project's registered class_name graph.
          timeout --signal=TERM 60s ./tools/run_self_play_dataset.sh \
            --preset=smoke \
            --max-games=1 \
            --out="${OUT}"
          python - "${OUT}" <<'PY'
          import json
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          rows = [
              json.loads(line)
              for line in (root / "search_decisions.jsonl").read_text().splitlines()
              if line.strip()
          ]
          if not rows:
              raise SystemExit("smoke self-play produced no 2x2 search decisions")
          for row in rows:
              if not row.get("starting_state"):
                  raise SystemExit("search decision missing starting_state")
              budget = row.get("budget", {})
              if budget.get("own_max_plans") != 2 or budget.get("opponent_max_plans") != 2:
                  raise SystemExit(f"unexpected search budget: {budget}")
              if row.get("candidate_count") != 2 or row.get("opponent_response_count") != 2:
                  raise SystemExit("smoke decision did not preserve the full 2x2 matrix")
              if not row.get("complete_requested_matrix"):
                  raise SystemExit("smoke decision marked its 2x2 matrix incomplete")
              candidates = row.get("candidates", [])
              if sum(bool(candidate.get("selected")) for candidate in candidates) != 1:
                  raise SystemExit("search decision must identify exactly one selected candidate")
              for candidate in candidates:
                  leaves = candidate.get("responses", [])
                  if len(leaves) != 2:
                      raise SystemExit("candidate missing one modeled opponent response")
                  for leaf in leaves:
                      if not leaf.get("state_after_first_turn"):
                          raise SystemExit("search leaf missing resulting state")
              if "game_outcome" not in row:
                  raise SystemExit("search decision missing eventual game outcome")

          manifest = json.loads((root / "search_decisions_manifest.json").read_text())
          if manifest.get("failed_decision_count") != 0:
              raise SystemExit(f"search decision capture failures: {manifest}")
          if manifest.get("selected_candidate_missing_count") != 0:
              raise SystemExit(f"selected plan drift detected: {manifest}")
          if manifest.get("complete_matrix_count") != manifest.get("decision_count"):
              raise SystemExit(f"smoke matrices are incomplete: {manifest}")
          print(f"validated {len(rows)} full 2x2 search decisions")
          PY

          # Continuation labeling is deliberately separate from self-play because a
          # current neural checkpoint is optional. CI exercises the tactical fallback
          # path without installing PyTorch or running the expensive Arena.
          timeout --signal=TERM 60s godot --headless --path . \
            res://tools/search_decision_continuations.tscn -- \
            --out="${OUT}" \
            --max-continuations=2
          python - "${OUT}" <<'PY'
          import json
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          labels = [
              json.loads(line)
              for line in (root / "rejected_continuations.jsonl").read_text().splitlines()
              if line.strip()
          ]
          if not labels:
              raise SystemExit("continuation smoke produced no rejected-alternative rows")
          for row in labels:
              if row.get("played_candidate_index") == row.get("rejected_candidate_index"):
                  raise SystemExit("continuation label did not use a rejected candidate")
              if not row.get("priority_reasons"):
                  raise SystemExit("continuation label missing prioritization reason")
              if row.get("continuation_policy") != "handwritten_greedy":
                  raise SystemExit("unexpected continuation policy")
              if "labeled" not in row or "perspective_outcome" not in row:
                  raise SystemExit("continuation row missing outcome fields")
              if not row.get("state_after_first_turn"):
                  raise SystemExit("continuation row missing forced-branch state")

          manifest = json.loads((root / "rejected_continuations_manifest.json").read_text())
          if manifest.get("continuations_invalid") != 0:
              raise SystemExit(f"invalid continuation labels: {manifest}")
          if manifest.get("continuations_selected") != len(labels):
              raise SystemExit(f"continuation manifest/file mismatch: {manifest}")
          print(f"validated {len(labels)} selective rejected-alternative continuations")
          PY

          # Compile/runtime-check the response-controlled sibling continuation path.
          # The tiny smoke fixture may legitimately produce zero preference pairs if
          # both siblings end identically, so CI validates structure rather than count.
          timeout --signal=TERM 60s godot --headless --path . \
            res://tools/search_decision_ranking_pairs.tscn -- \
            --out="${OUT}"
          python - "${OUT}" <<'PY'
          import json
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          pair_path = root / "ranking_pairs.jsonl"
          manifest_path = root / "ranking_pairs_manifest.json"
          if not pair_path.exists() or not manifest_path.exists():
              raise SystemExit("ranking-pair smoke output missing")
          pairs = [
              json.loads(line)
              for line in pair_path.read_text().splitlines()
              if line.strip()
          ]
          for row in pairs:
              if row.get("pair_kind") not in {"outcome", "faster_win"}:
                  raise SystemExit(f"unexpected ranking pair kind: {row}")
              if float(row.get("weight", 0)) <= 0:
                  raise SystemExit("ranking pair weight must be positive")
              if not row.get("better_state") or not row.get("worse_state"):
                  raise SystemExit("ranking pair missing sibling states")
              if row.get("pair_kind") == "outcome" and not (
                  float(row.get("better_outcome", 0)) > float(row.get("worse_outcome", 0))
              ):
                  raise SystemExit("outcome ranking pair is not ordered")
              if (
                  float(row.get("better_outcome", 0)) == -1.0
                  and float(row.get("worse_outcome", 0)) == -1.0
              ):
                  raise SystemExit("loss-vs-loss ranking pair should never be emitted")

          manifest = json.loads(manifest_path.read_text())
          if int(manifest.get("invalid", 0)) != 0:
              raise SystemExit(f"invalid sibling continuation branches: {manifest}")
          if int(manifest.get("pairs_written", -1)) != len(pairs):
              raise SystemExit(f"ranking manifest/file mismatch: {manifest}")
          if not manifest.get("same_opponent_response"):
              raise SystemExit("ranking pairs must hold opponent response fixed")
          if manifest.get("loss_vs_loss_pairs"):
              raise SystemExit("ranking policy must exclude loss-vs-loss labels")
          print(f"validated {len(pairs)} response-controlled sibling ranking pairs")
          PY

      - name: Upload test output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: godot-test-output
          path: |
            hex-strategy-game/test-output.log
            artifacts/search-decision-smoke/
          if-no-files-found: ignore
