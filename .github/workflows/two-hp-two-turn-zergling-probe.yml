name: Two HP Two Turn Zergling Probe

on:
  workflow_dispatch:
  push:
    branches: [ai/heuristic-champion-generations]
    paths: [.github/two-hp-two-turn-probe-trigger]

permissions:
  contents: read
  actions: read

env:
  BASE_RUN_ID: '35557083128'

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate robust two-turn counterfactual rows
        run: |
          mkdir -p artifacts/data
          python ml/value_model/make_two_hp_two_turn_probe_data.py \
            --out=artifacts/data
      - name: Audit two-turn contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("artifacts/data/manifest.json").read_text())
          assert m["hex_radius"]==1,m
          assert m["initial_marine_health"]==2,m
          assert m["initial_zergling_health"]==3,m
          assert m["initial_adjacent"] is True,m
          assert m["initial_different_hexes"] is True,m
          assert m["marine_allowed_actions"]==["<hold>","move_short"],m
          assert m["marine_attack_short_excluded"] is True,m
          assert m["turn_limit"]==2,m
          assert m["directed_initial_layouts"]==24,m
          assert m["train_initial_layouts"]==18 and m["heldout_initial_layouts"]==6,m
          for file in ["train_rows.jsonl","eval_rows.jsonl"]:
              rows=[json.loads(x) for x in Path("artifacts/data",file).read_text().splitlines() if x.strip()]
              assert rows
              for r in rows:
                  assert r["target_indices"]
                  s=r["state"]
                  assert s["hex_radius"]==1
                  groups={g["name"]:g for g in s["groups"]}
                  marine=groups["terran"]["units"][0]
                  zerg=groups["zerg"]["units"][0]
                  if r["decision_role"]=="opening":
                      assert marine["health"]==2
                      assert marine["cell"]!=zerg["cell"]
                      target=r["candidate_actions"][r["target_indices"][0]]
                      assert target["action_key"]=="fast_move"
                      assert target["end_point"]==marine["cell"]
                  else:
                      assert marine["health"]==1
                      resp=r["marine_response"]
                      assert resp["action_key"] in {"<hold>","move_short"}
          print(json.dumps(m,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: two-hp-two-turn-probe-data
          path: artifacts/data/
          retention-days: 30

  train:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: lr1e4
            lr: 0.0001
          - label: lr3e4
            lr: 0.0003
          - label: lr1e3
            lr: 0.001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - uses: actions/download-artifact@v4
        with:
          name: two-hp-two-turn-probe-data
          path: data
      - uses: actions/download-artifact@v4
        with:
          name: small-arena-g5
          path: checkpoint
          repository: Sanghvimanav/godot-hex-strategy-game
          run-id: ${{ env.BASE_RUN_ID }}
          github-token: ${{ github.token }}
      - name: One supervised pass from Gen 5 policy
        run: |
          mkdir -p "artifacts/${{ matrix.label }}"
          python -m ml.value_model.train_two_turn_counterfactual_probe \
            --base-checkpoint=checkpoint/model.pt \
            --train-rows=data/train_rows.jsonl \
            --eval-rows=data/eval_rows.jsonl \
            --output="artifacts/${{ matrix.label }}/model.pt" \
            --metrics="artifacts/${{ matrix.label }}/metrics.json" \
            --learning-rate="${{ matrix.lr }}" \
            --training-examples=4860 \
            --seed=23 \
            --device=cpu
      - name: Audit training invariants
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          label=os.environ["LABEL"]
          m=json.loads(Path("artifacts",label,"metrics.json").read_text())
          assert m["training_passes"]==1 and m["epochs"]==0,m
          assert m["base_policy_loaded"] is True,m
          assert m["shared_spatial_encoder_frozen"] is True,m
          assert m["explicit_action_mechanics_features"] is False,m
          assert m["marine_allowed_actions"]==["<hold>","move_short"],m
          assert m["train_initial_layouts"]==18 and m["heldout_initial_layouts"]==6,m
          assert m["training_examples"]==4860,m
          assert m["vocab_expansion"]["new_action_tokens"]==[],m["vocab_expansion"]
          assert m["vocab_expansion"]["new_unit_tokens"]==[],m["vocab_expansion"]
          print(json.dumps({
            "learning_rate":m["learning_rate"],
            "heldout_robust_before":m["before_eval"]["robust_two_turn_win_rate"],
            "heldout_robust_after":m["after_eval"]["robust_two_turn_win_rate"],
            "heldout_opening_before":m["before_eval"]["opening_top1_accuracy"],
            "heldout_opening_after":m["after_eval"]["opening_top1_accuracy"],
            "heldout_cont_before":m["before_eval"]["continuation_top1_accuracy"],
            "heldout_cont_after":m["after_eval"]["continuation_top1_accuracy"],
            "heldout_target_prob_before":m["before_eval"]["mean_target_probability"],
            "heldout_target_prob_after":m["after_eval"]["mean_target_probability"],
          },indent=2))
          PY
        env:
          LABEL: ${{ matrix.label }}
      - uses: actions/upload-artifact@v4
        with:
          name: two-hp-two-turn-probe-${{ matrix.label }}
          path: artifacts/${{ matrix.label }}/
          retention-days: 30

  report:
    needs: train
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: two-hp-two-turn-probe-lr*
          path: results
      - name: Summarize two-turn capacity probe
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[]
          for p in sorted(Path("results").glob("two-hp-two-turn-probe-lr*/metrics.json")):
              m=json.loads(p.read_text())
              rows.append({
                  "learning_rate":m["learning_rate"],
                  "train_robust_before":m["before_train"]["robust_two_turn_win_rate"],
                  "train_robust_after":m["after_train"]["robust_two_turn_win_rate"],
                  "eval_robust_before":m["before_eval"]["robust_two_turn_win_rate"],
                  "eval_robust_after":m["after_eval"]["robust_two_turn_win_rate"],
                  "eval_open_before":m["before_eval"]["opening_top1_accuracy"],
                  "eval_open_after":m["after_eval"]["opening_top1_accuracy"],
                  "eval_cont_before":m["before_eval"]["continuation_top1_accuracy"],
                  "eval_cont_after":m["after_eval"]["continuation_top1_accuracy"],
                  "eval_prob_before":m["before_eval"]["mean_target_probability"],
                  "eval_prob_after":m["after_eval"]["mean_target_probability"],
              })
          assert len(rows)==3,rows
          Path("two_turn_capacity_probe.json").write_text(json.dumps(rows,indent=2)+"\n")
          lines=[
              "# Two-HP, two-turn Zergling capacity probe",
              "",
              "Gen 5 base policy; radius 1; 2-HP Marine starts adjacent on a different hex.",
              "Marine may hold or move_short. Robust success requires the greedy Zerg policy to kill by turn 2 for every allowed response.",
              "",
              "| LR | Train robust before | Train robust after | Heldout robust before | Heldout robust after | Heldout opening after | Heldout continuation after |",
              "| ---: | ---: | ---: | ---: | ---: | ---: | ---: |",
          ]
          for r in rows:
              lines.append(f"| {r['learning_rate']:.0e} | {r['train_robust_before']:.1%} | {r['train_robust_after']:.1%} | {r['eval_robust_before']:.1%} | {r['eval_robust_after']:.1%} | {r['eval_open_after']:.1%} | {r['eval_cont_after']:.1%} |")
          summary="\n".join(lines)+"\n"
          Path("summary.md").write_text(summary)
          with Path(__import__("os").environ["GITHUB_STEP_SUMMARY"]).open("a") as h:
              h.write(summary)
          print(summary)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: two-hp-two-turn-capacity-probe-report
          path: |
            two_turn_capacity_probe.json
            summary.md
          retention-days: 30
