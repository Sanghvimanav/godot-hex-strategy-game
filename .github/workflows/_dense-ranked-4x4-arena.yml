name: Dense Ranked 4x4 Arena

on:
  push:
    branches:
      - experiment/dense-ranked-4x4-arena

permissions:
  contents: read
  actions: read

jobs:
  arena:
    name: 4x4 arena shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      SOURCE_ARTIFACT_ID: "10032510440"
      SHARD_COUNT: 4
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Download dense-ranked checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip" > /tmp/dense-ranked.zip
          rm -rf /tmp/dense-ranked
          mkdir -p /tmp/dense-ranked hex-strategy-game/models
          unzip -q /tmp/dense-ranked.zip -d /tmp/dense-ranked
          test -s /tmp/dense-ranked/ranked_value_model.pt
          cp /tmp/dense-ranked/ranked_value_model.pt hex-strategy-game/models/objective_aware_candidate_v1.pt
          test -s hex-strategy-game/models/objective_aware_candidate_v1.pt

      - name: Set up Godot 4.6
        uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: 4.6.0
          use-dotnet: false
          include-templates: false

      - name: Import Godot project
        working-directory: hex-strategy-game
        run: godot --headless --import

      - name: Run frozen fast-set 4x4 mirrored arena
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/arena
          cd hex-strategy-game
          godot --headless --path . res://tools/ai_arena.tscn -- \
            --preset=fast \
            --champion-profile=balanced \
            --challenger-profile=balanced \
            --champion-evaluator=handwritten \
            --challenger-evaluator=neural \
            --rules-version="${GITHUB_SHA}" \
            --out="${GITHUB_WORKSPACE}/artifacts/arena" \
            --shard-index="${{ matrix.shard }}" \
            --shard-count="${SHARD_COUNT}"

      - name: Upload arena shard
        uses: actions/upload-artifact@v4
        with:
          name: dense-ranked-4x4-shard-${{ matrix.shard }}
          path: artifacts/arena/
          if-no-files-found: error
          retention-days: 3

  merge:
    name: Merge dense-ranked 4x4 arena
    needs: arena
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download arena shards
        uses: actions/download-artifact@v4
        with:
          pattern: dense-ranked-4x4-shard-*
          path: artifacts/arena_shards
          merge-multiple: false

      - name: Audit and summarize tournament
        run: |
          python3 hex-strategy-game/tools/merge_ai_arena.py \
            --input-root artifacts/arena_shards \
            --out artifacts/arena_merged
          cat artifacts/arena_merged/summary.md >> "$GITHUB_STEP_SUMMARY"
          cat artifacts/arena_merged/summary.md

      - name: Upload merged arena
        uses: actions/upload-artifact@v4
        with:
          name: dense-ranked-4x4-arena
          path: artifacts/arena_merged/
          if-no-files-found: error
          retention-days: 14
