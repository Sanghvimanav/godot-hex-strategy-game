  train_g9:
    name: Train generation 9
    needs: data_g9
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - uses: actions/download-artifact@v4
        with:
          name: small-selfplay-v5-balanced-g8
          path: checkpoint
      - uses: actions/download-artifact@v4
        with:
          pattern: small-selfplay-v5-balanced-train-g9-s*
          path: generation-shards
      - name: Merge and audit fresh self-play generation
        run: |
          mkdir -p artifacts/combined artifacts/output
          find generation-shards -name policy_steps.jsonl -print | sort | xargs cat > artifacts/combined/policy_steps.jsonl
          find generation-shards -name value_examples.jsonl -print | sort | xargs cat > artifacts/combined/value_examples.jsonl
          find generation-shards -name games.jsonl -print | sort | xargs cat > artifacts/combined/games.jsonl
          python - <<'PY'
          import json
          from pathlib import Path
          games=[json.loads(x) for x in Path("artifacts/combined/games.jsonl").read_text().splitlines() if x.strip()]
          policy=[json.loads(x) for x in Path("artifacts/combined/policy_steps.jsonl").read_text().splitlines() if x.strip()]
          values=[json.loads(x) for x in Path("artifacts/combined/value_examples.jsonl").read_text().splitlines() if x.strip()]
          assert len(games)==480,len(games)
          assert len({g["game_id"] for g in games})==480
          assert len({g["scenario_seed"] for g in games})==480
          matchups=[f"{m}v{z}" for z in range(1,5) for m in range(1,4)]
          counts={k:sum(g["matchup"]==k for g in games) for k in matchups}
          assert counts=={k:40 for k in matchups},counts
          assert {int(x["generation"]) for x in policy}=={9}
          assert {str(x["perspective_group"]) for x in policy}=={"terran","zerg"}
          assert {int(x["source"]["generation"]) for x in values}=={9}
          assert {str(x["perspective_group"]) for x in values}=={"terran","zerg"}
          for row in policy[:1000]:
              state=row["state"]
              assert state["hex_radius"]==1
              defs={u["def_path"].split("/")[-1] for group in state["groups"] for u in group["units"]}
              assert defs <= {"marine.tres","zergling.tres"},defs
          print(json.dumps({"games":len(games),"matchups":counts,"policy_steps":len(policy),"value_examples":len(values)},indent=2))
          PY
      - name: One PPO pass at policy LR 1e-3
        run: |
          python -m ml.value_model.train_outcome_actor_critic \
            --base-checkpoint="checkpoint/model.pt" \
            --policy-steps=artifacts/combined/policy_steps.jsonl \
            --value-examples=artifacts/combined/value_examples.jsonl \
            --output=artifacts/output/model.pt \
            --value-learning-rate=1e-4 \
            --policy-learning-rate=1e-3 \
            --entropy-beta=0.01 \
            --ppo-clip=0.2 \
            --training-opponent=current_policy_self_play \
            --seed=9 \
            --device=cpu \
            | tee artifacts/output/training_metrics.json
      - name: Audit training invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("artifacts/output/training_metrics.json").read_text())
          assert m["training_passes"]==1 and m["epochs"]==0,m
          assert m["mcts_used"] is False,m
          assert m["training_opponent"]=="current_policy_self_play",m
          assert m["shared_spatial_encoder_frozen"] is True,m
          assert abs(m["ppo_clip"]-0.2)<1e-9,m
          assert abs(m["policy_learning_rate"]-1e-3)<1e-12,m
          assert m["vocab_expansion"]["new_unit_tokens"]==[],m["vocab_expansion"]
          assert m["vocab_expansion"]["new_action_tokens"]==[],m["vocab_expansion"]
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: small-selfplay-v5-balanced-g9
          path: artifacts/output/
          retention-days: 30

