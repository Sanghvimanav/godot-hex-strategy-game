  report:
    name: Build small-arena learning curve
    needs: [eval_g0, eval_g1, eval_g2, eval_g3, eval_g4, eval_g5]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: small-arena-eval-g*-s*
          path: eval-shards
      - uses: actions/download-artifact@v4
        with:
          pattern: small-arena-g*
          path: checkpoints
      - name: Summarize fixed radius-one progression
        run: |
          mkdir -p artifacts/report
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[]
          for gen in range(6):
              manifests=[json.loads(p.read_text()) for p in sorted(Path("eval-shards").glob(f"small-arena-eval-g{gen}-s*/manifest.json"))]
              assert len(manifests)==4,(gen,len(manifests))
              games=[g for m in manifests for g in m["games"]]
              assert len(games)==160,(gen,len(games))
              counts={k:0 for k in ["win","loss","draw","unresolved","failed"]}
              matchup={}
              faction={}
              for g in games:
                  if not g["valid"]:
                      bucket="failed"
                  elif g["status"]=="turn_limit":
                      bucket="unresolved"
                  elif g["neural_outcome"]>0:
                      bucket="win"
                  elif g["neural_outcome"]<0:
                      bucket="loss"
                  else:
                      bucket="draw"
                  counts[bucket]+=1
                  matchup.setdefault(g["matchup"],{k:0 for k in counts})[bucket]+=1
                  faction.setdefault(g["neural_group"],{k:0 for k in counts})[bucket]+=1
              decisive=counts["win"]+counts["loss"]
              row={"generation":gen,"games":160,"counts":counts,
                   "decisive_win_rate":counts["win"]/decisive if decisive else 0,
                   "matchup_counts":matchup,"faction_counts":faction}
              if gen>0:
                  m=json.loads(Path(f"checkpoints/small-arena-g{gen}/training_metrics.json").read_text())
                  row["ppo_clipped_fraction"]=m["ppo_clipped_fraction"]
                  row["policy_entropy_after"]=m["policy_after"]["mean_entropy"]
                  row["mean_advantage"]=m["mean_advantage"]
                  row["mean_abs_advantage"]=m["mean_abs_advantage"]
                  row["value_mse_after"]=m["value_after"]["mse"]
              rows.append(row)
          Path("artifacts/report/learning_curve.json").write_text(json.dumps(rows,indent=2)+"\n")
          lines=[
              "# Radius-one Marine vs Zergling learning curve",
              "",
              "Direct neural policy vs frozen handwritten heuristic. Fixed evaluation: 160 games/generation, 80% 3v3 base states.",
              "",
              "| Gen | Neural wins | Heuristic wins | Draw | Unresolved | Decisive win rate | Entropy |",
              "| ---: | ---: | ---: | ---: | ---: | ---: | ---: |",
          ]
          for r in rows:
              ent="" if r["generation"]==0 else f"{r['policy_entropy_after']:.3f}"
              lines.append(f"| {r['generation']} | {r['counts']['win']} | {r['counts']['loss']} | {r['counts']['draw']} | {r['counts']['unresolved']} | {r['decisive_win_rate']:.1%} | {ent} |")
          summary="\n".join(lines)+"\n"
          Path("artifacts/report/summary.md").write_text(summary)
          with Path(__import__("os").environ["GITHUB_STEP_SUMMARY"]).open("a") as h:
              h.write(summary)
          print(summary)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: small-arena-v3-learning-curve
          path: artifacts/report/
          retention-days: 30
