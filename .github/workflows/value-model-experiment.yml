name: Value Model Experiment

on:
  workflow_dispatch:
    inputs:
      preset:
        description: Self-play preset to generate
        required: true
        default: diverse
        type: choice
        options:
          - diverse
          - starter
          - smoke
      counterfactual_preset:
        description: Counterfactual suite used for decision-quality evaluation
        required: true
        default: curated
        type: choice
        options:
          - curated
          - starter
          - smoke
      epochs:
        description: Training epochs
        required: true
        default: 60
        type: number

permissions:
  contents: read

concurrency:
  group: value-model-experiment-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  self-play:
    name: Self-play shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      EXPERIMENT_PRESET: ${{ inputs.preset }}
      SHARD_COUNT: 4

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Godot 4.6
        uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: 4.6.0
          use-dotnet: false
          include-templates: false

      - name: Import Godot project
        working-directory: hex-strategy-game
        run: godot --headless --import

      - name: Generate self-play shard
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/self_play
          cd hex-strategy-game
          ./tools/run_self_play_dataset.sh \
            --preset="${EXPERIMENT_PRESET}" \
            --out="${GITHUB_WORKSPACE}/artifacts/self_play" \
            --shard-index="${{ matrix.shard }}" \
            --shard-count="${SHARD_COUNT}"

      - name: Upload self-play shard
        uses: actions/upload-artifact@v4
        with:
          name: self-play-shard-${{ matrix.shard }}
          path: artifacts/self_play/
          if-no-files-found: error
          retention-days: 3

  counterfactual:
    name: Counterfactual shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      COUNTERFACTUAL_PRESET: ${{ inputs.counterfactual_preset }}
      SHARD_COUNT: 4

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Godot 4.6
        uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: 4.6.0
          use-dotnet: false
          include-templates: false

      - name: Import Godot project
        working-directory: hex-strategy-game
        run: godot --headless --import

      - name: Generate counterfactual shard
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/counterfactual
          cd hex-strategy-game
          bash tools/run_counterfactual_benchmark.sh \
            --preset="${COUNTERFACTUAL_PRESET}" \
            --out="${GITHUB_WORKSPACE}/artifacts/counterfactual" \
            --shard-index="${{ matrix.shard }}" \
            --shard-count="${SHARD_COUNT}"

      - name: Upload counterfactual shard
        uses: actions/upload-artifact@v4
        with:
          name: counterfactual-shard-${{ matrix.shard }}
          path: artifacts/counterfactual/
          if-no-files-found: error
          retention-days: 3

  merge-train-evaluate:
    name: Merge, train, compare
    needs: [self-play, counterfactual]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPERIMENT_PRESET: ${{ inputs.preset }}
      COUNTERFACTUAL_PRESET: ${{ inputs.counterfactual_preset }}
      EXPERIMENT_EPOCHS: ${{ inputs.epochs }}
      SHARD_COUNT: 4

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Godot 4.6
        uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: 4.6.0
          use-dotnet: false
          include-templates: false

      - name: Download self-play shards
        uses: actions/download-artifact@v4
        with:
          pattern: self-play-shard-*
          path: artifacts/self_play_shards
          merge-multiple: false

      - name: Download counterfactual shards
        uses: actions/download-artifact@v4
        with:
          pattern: counterfactual-shard-*
          path: artifacts/counterfactual_shards
          merge-multiple: false

      - name: Merge and sort generator shards
        run: |
          python ml/value_model/merge_generation_shards.py \
            --self-play-root artifacts/self_play_shards \
            --counterfactual-root artifacts/counterfactual_shards \
            --self-play-output artifacts/self_play \
            --counterfactual-output artifacts/counterfactual

      - name: Audit merged generation
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(Path("artifacts/self_play/manifest.json").read_text())
          counterfactual = json.loads(Path("artifacts/counterfactual/manifest.json").read_text())
          print(json.dumps(manifest, indent=2, sort_keys=True))
          print(json.dumps(counterfactual, indent=2, sort_keys=True))

          expected_shards = int(os.environ["SHARD_COUNT"])
          if int(manifest.get("generation_shards", 0)) != expected_shards:
              raise SystemExit("self-play merged shard count mismatch")
          if int(counterfactual.get("generation_shards", 0)) != expected_shards:
              raise SystemExit("counterfactual merged shard count mismatch")

          requested = int(manifest["games_requested"])
          labeled = int(manifest["games_labeled"])
          failed = int(manifest["games_failed"])
          examples = int(manifest["example_count"])
          trace_count = int(manifest["trace_count"])
          traces_path = Path("artifacts/self_play/traces.jsonl")
          if requested <= 0:
              raise SystemExit("self-play preset produced no requested games")
          if trace_count != requested or not traces_path.exists():
              raise SystemExit(
                  f"expected one diagnostic trace per game; got {trace_count}/{requested}"
              )
          trace_lines = [line for line in traces_path.read_text().splitlines() if line.strip()]
          if len(trace_lines) != trace_count:
              raise SystemExit(
                  f"trace manifest/file mismatch: manifest={trace_count} file={len(trace_lines)}"
              )

          failure_rate = failed / requested
          labeled_rate = labeled / requested
          failed_games = [game["game_id"] for game in manifest["games"] if not game.get("valid")]
          labeled_families = {
              game["scenario_id"] for game in manifest["games"] if game.get("labeled")
          }
          command_capture_games = [
              game["game_id"]
              for game in manifest["games"]
              if game.get("termination_reason") == "command_hex_capture"
          ]

          print(f"failure_rate={failure_rate:.1%} failed_games={failed_games}")
          print(f"labeled_rate={labeled_rate:.1%} labeled_families={sorted(labeled_families)}")
          print(f"command_hex_captures={len(command_capture_games)} games={command_capture_games}")

          if failure_rate > 0.25:
              raise SystemExit(
                  f"too many self-play games failed: {failed}/{requested} ({failure_rate:.1%})"
              )
          if labeled < 2 or examples <= 0:
              raise SystemExit("need at least two terminal games with training examples")
          if os.environ["EXPERIMENT_PRESET"] == "diverse":
              if labeled_rate < 0.40:
                  raise SystemExit(
                      f"diverse preset needs at least 40% labeled games; got {labeled}/{requested} ({labeled_rate:.1%})"
                  )
              if len(labeled_families) < 4:
                  raise SystemExit(
                      f"diverse preset needs at least four labeled tactical families; got {sorted(labeled_families)}"
                  )
          if int(counterfactual.get("decisions_requested", 0)) <= 0:
              raise SystemExit("counterfactual preset produced no decisions")
          if int(counterfactual.get("decisions_failed", 0)) != 0:
              raise SystemExit("counterfactual generation contained failed decisions")
          if int(counterfactual.get("candidate_count", 0)) <= 0:
              raise SystemExit("counterfactual generation produced no candidates")
          PY

      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run value-model tests
        run: python -m unittest discover -s ml/tests -v

      - name: Import Godot project for evaluator scoring
        working-directory: hex-strategy-game
        run: godot --headless --import

      - name: Score held-out states with real handwritten evaluator
        shell: bash
        run: |
          set -euo pipefail
          python -m ml.value_model.export_validation_examples \
            --data artifacts/self_play/examples.jsonl \
            --output artifacts/heldout_nonterminal.jsonl \
            --validation-fraction 0.25 \
            --split-key source.base_scenario_id \
            --seed 0
          cd hex-strategy-game
          godot --headless --script res://tools/export_handwritten_value_baseline.gd -- \
            "${GITHUB_WORKSPACE}/artifacts/heldout_nonterminal.jsonl" \
            "${GITHUB_WORKSPACE}/artifacts/handwritten_baseline.json"

      - name: Train with held-out scenario families
        shell: bash
        run: |
          set -euo pipefail
          python -m ml.value_model.train \
            --data artifacts/self_play/examples.jsonl \
            --output artifacts/value_model.pt \
            --epochs "${EXPERIMENT_EPOCHS}" \
            --validation-fraction 0.25 \
            --split-key source.base_scenario_id \
            --handwritten-baseline artifacts/handwritten_baseline.json \
            | tee artifacts/metrics.json

      - name: Annotate counterfactual leaves with real handwritten evaluator
        shell: bash
        run: |
          set -euo pipefail
          cd hex-strategy-game
          godot --headless --script res://tools/annotate_counterfactual_handwritten_scores.gd -- \
            "${GITHUB_WORKSPACE}/artifacts/counterfactual/candidates.jsonl" \
            "${GITHUB_WORKSPACE}/artifacts/counterfactual/candidates_with_handwritten.jsonl"

      - name: Evaluate candidate ranking and regret
        shell: bash
        run: |
          set -euo pipefail
          python -m ml.value_model.evaluate_counterfactual \
            --candidates artifacts/counterfactual/candidates_with_handwritten.jsonl \
            --checkpoint artifacts/value_model.pt \
            --output artifacts/counterfactual_metrics.json

      - name: Write experiment summary
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(Path("artifacts/self_play/manifest.json").read_text())
          counterfactual = json.loads(Path("artifacts/counterfactual/manifest.json").read_text())
          metrics = json.loads(Path("artifacts/metrics.json").read_text())
          decision_quality = json.loads(Path("artifacts/counterfactual_metrics.json").read_text())
          neural_decision = decision_quality["evaluators"]["neural_value_model"]
          handwritten_decision = decision_quality["evaluators"]["handwritten_state_evaluator"]
          proposal_decision = decision_quality["evaluators"]["planner_proposal_score"]
          neural = float(metrics["neural_eval_sign_accuracy_nonterminal"])
          handwritten = float(metrics["handwritten_eval_sign_accuracy_nonterminal"])
          delta = float(metrics["neural_minus_handwritten_sign_accuracy_nonterminal"])
          fingerprint = str(metrics["handwritten_evaluator_fingerprint"])
          direction = "ahead" if delta > 0 else "behind" if delta < 0 else "tied"
          labeled_families = sorted({
              game["scenario_id"] for game in manifest["games"] if game.get("labeled")
          })
          failed_games = [game["game_id"] for game in manifest["games"] if not game.get("valid")]
          command_capture_games = [
              game["game_id"]
              for game in manifest["games"]
              if game.get("termination_reason") == "command_hex_capture"
          ]
          failure_rate = manifest["games_failed"] / manifest["games_requested"]

          summary = f"""## Value-model generalization experiment

          This is a **directional experiment**, not a production-quality benchmark.

          | Metric | Result |
          | --- | ---: |
          | Preset | {manifest['preset']} |
          | Generation shards | {manifest['generation_shards']} self-play / {counterfactual['generation_shards']} counterfactual |
          | Labeled games | {manifest['games_labeled']} / {manifest['games_requested']} |
          | Labeled tactical families | {len(labeled_families)} |
          | Command-hex capture games | {len(command_capture_games)} |
          | Unlabeled turn-limit games | {manifest['games_unlabeled']} |
          | Failed games | {manifest['games_failed']} ({failure_rate:.1%}) |
          | Training examples | {metrics['train_examples']} |
          | Held-out examples | {metrics['validation_examples']} |
          | Held-out nonterminal comparison examples | {metrics['eval_nonterminal_examples']} |
          | Neural nonterminal winner-prediction accuracy | {neural:.1%} |
          | Handwritten nonterminal winner-prediction accuracy | {handwritten:.1%} |
          | Neural minus handwritten | {delta:+.1%} |
          | Handwritten evaluator fingerprint | `{fingerprint[:16]}…` |
          | Counterfactual decisions / candidates | {decision_quality['evaluated_decisions']} / {decision_quality['evaluated_candidates']} |
          | Neural candidate-ranking accuracy | {neural_decision['candidate_ranking_accuracy']:.1%} |
          | Neural mean / max regret; optimal-choice rate | {neural_decision['top_plan_mean_regret']:.3f} / {neural_decision['top_plan_max_regret']:.3f}; {neural_decision['top_plan_optimal_rate']:.1%} |
          | Handwritten candidate-ranking accuracy | {handwritten_decision['candidate_ranking_accuracy']:.1%} |
          | Handwritten mean / max regret; optimal-choice rate | {handwritten_decision['top_plan_mean_regret']:.3f} / {handwritten_decision['top_plan_max_regret']:.3f}; {handwritten_decision['top_plan_optimal_rate']:.1%} |
          | Planner proposal candidate-ranking accuracy | {proposal_decision['candidate_ranking_accuracy']:.1%} |
          | Planner proposal mean / max regret; optimal-choice rate | {proposal_decision['top_plan_mean_regret']:.3f} / {proposal_decision['top_plan_max_regret']:.3f}; {proposal_decision['top_plan_optimal_rate']:.1%} |

          **Split key:** `{metrics['split_key']}`  
          **Training scenario families:** {', '.join(metrics['train_split_groups']) or 'none'}  
          **Held-out scenario families:** {', '.join(metrics['validation_split_groups']) or 'none'}  
          **All labeled families:** {', '.join(labeled_families) or 'none'}  
          **Command-hex capture games:** {', '.join(command_capture_games) or 'none'}  
          **Failed games excluded from training:** {', '.join(failed_games) or 'none'}  
          **Game outcomes:** `{manifest['outcomes']}`

          Winner-prediction and counterfactual handwritten scores are produced by the real same-commit Godot `PureStateEvaluator`; Python does not maintain an authoritative copy. On the winner-prediction sample, the neural evaluator is **{direction}** the handwritten evaluator. Strength claims should still be based on candidate ranking, regret, and direct gameplay arenas.
          """
          Path("artifacts/summary.md").write_text(summary, encoding="utf-8")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as handle:
              handle.write(summary)
          print(summary)
          PY

      - name: Upload experiment artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: value-model-experiment-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
