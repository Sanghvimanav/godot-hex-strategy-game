name: Outcome Policy V1 Experiment

on:
  workflow_dispatch:
  push:
    branches: [ai/outcome-policy-v1]
    paths: [.github/outcome-policy-v1-trigger]

permissions:
  contents: read
  actions: read

concurrency:
  group: outcome-policy-v1-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_DATA_RUN_ID: '34784986112'
  BASE_POLICY_RUN_ID: '34799925923'

jobs:
  candidate_train:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mcts-policy-baseline
          path: source-data
          repository: Sanghvimanav/godot-hex-strategy-game
          run-id: ${{ env.SOURCE_DATA_RUN_ID }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: spatial-policy-v1-candidate
          path: base-policy
          repository: Sanghvimanav/godot-hex-strategy-game
          run-id: ${{ env.BASE_POLICY_RUN_ID }}
          github-token: ${{ github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Unit test outcome target construction
        run: python -m unittest ml.tests.test_outcome_plan_policy -v
      - name: Outcome-only policy-gradient fine-tune
        run: |
          mkdir -p artifacts/candidate
          python -m ml.value_model.train_outcome_plan_policy \
            --base-checkpoint=base-policy/spatial_policy_v1_model.pt \
            --search-decisions=source-data/combined/search_decisions.jsonl \
            --value-examples=source-data/combined/examples.jsonl \
            --output=artifacts/candidate/outcome_policy_v1_model.pt \
            --evaluator=neural --epochs=10 --learning-rate=1e-4 \
            --entropy-weight=0.01 --seed=0 --device=cpu
      - name: Audit outcome-only checkpoint and runtime
        run: |
          python - <<'PY'
          import json, subprocess, torch
          from pathlib import Path
          path = 'artifacts/candidate/outcome_policy_v1_model.pt'
          checkpoint = torch.load(path, map_location='cpu', weights_only=False)
          config = checkpoint['joint_plan_policy_config']
          metrics = checkpoint['outcome_policy_metrics']
          training = checkpoint['outcome_policy_training_config']
          assert config['version'] == 3, config
          assert config['architecture'] == 'spatial_entity_attention_v1', config
          assert config['target'] == 'signed_self_play_outcome_policy_gradient', config
          assert metrics['robust_search_scores_used_in_loss'] is False, metrics
          assert metrics['mcts_visit_targets_used_in_loss'] is False, metrics
          assert training['backbone_frozen'] is True, training
          assert training['robust_search_scores_used_in_loss'] is False, training
          assert metrics['decision_outcomes']['win'] > 0, metrics
          assert metrics['decision_outcomes']['loss'] > 0, metrics
          proc = subprocess.run(
              ['python', 'hex-strategy-game/tools/neural_value_runtime.py', '--checkpoint', path],
              input='', text=True, capture_output=True, timeout=20,
          )
          ready = json.loads(proc.stdout.splitlines()[0])
          assert ready.get('ready') is True, (ready, proc.stderr)
          assert ready.get('joint_plan_policy_spatial_entities') is True, ready
          Path('artifacts/candidate/outcome_policy_metrics.json').write_text(json.dumps(metrics, indent=2) + '\n')
          Path('artifacts/candidate/runtime_ready.json').write_text(json.dumps(ready, indent=2) + '\n')
          print(json.dumps({'metrics': metrics, 'runtime': ready}, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: outcome-policy-v1-candidate
          path: artifacts/candidate/
          retention-days: 30

  evaluate_random:
    needs: candidate_train
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: outcome-policy-v1-candidate
          path: candidate
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: 4.6.0
          use-dotnet: false
          include-templates: false
      - name: Import Godot project
        working-directory: hex-strategy-game
        run: godot --headless --import
      - name: Deterministic random holdout
        working-directory: hex-strategy-game
        run: |
          godot --headless --path . res://tools/basic_random_arena.tscn -- \
            --mode=random --pair-count=36 --decision-time-budget-ms=5000 \
            --learned-proposals=true \
            --checkpoint="$GITHUB_WORKSPACE/candidate/outcome_policy_v1_model.pt" \
            --rules-version="$GITHUB_SHA" --runner-type=ubuntu-latest \
            --shard-index=${{ matrix.shard }} --shard-count=3 \
            --out="$GITHUB_WORKSPACE/artifacts/evaluation"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: outcome-policy-v1-random-${{ matrix.shard }}
          path: artifacts/evaluation/
          retention-days: 30

  evaluate_counterfactual:
    needs: candidate_train
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: outcome-policy-v1-candidate
          path: candidate
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: 4.6.0
          use-dotnet: false
          include-templates: false
      - name: Import Godot project
        working-directory: hex-strategy-game
        run: godot --headless --import
      - name: Fixed counterfactual holdout
        working-directory: hex-strategy-game
        run: |
          godot --headless --path . res://tools/basic_random_arena.tscn -- \
            --mode=counterfactual --decision-time-budget-ms=5000 \
            --learned-proposals=true \
            --checkpoint="$GITHUB_WORKSPACE/candidate/outcome_policy_v1_model.pt" \
            --rules-version="$GITHUB_SHA" --runner-type=ubuntu-latest \
            --shard-index=${{ matrix.shard }} --shard-count=3 \
            --out="$GITHUB_WORKSPACE/artifacts/evaluation"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: outcome-policy-v1-counterfactual-${{ matrix.shard }}
          path: artifacts/evaluation/
          retention-days: 30

  candidate_m2z1:
    needs: candidate_train
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: outcome-policy-v1-candidate
          path: candidate
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: 4.6.0
          use-dotnet: false
          include-templates: false
      - name: Import Godot project
        working-directory: hex-strategy-game
        run: godot --headless --import
      - name: Held-out 2M1Z robust vs MCTS-2
        working-directory: hex-strategy-game
        run: |
          godot --headless --path . res://tools/m2z1_puct_diagnostic.tscn -- \
            --puct-simulations=16 --puct-max-depth=3 \
            --checkpoint="$GITHUB_WORKSPACE/candidate/outcome_policy_v1_model.pt" \
            --out="$GITHUB_WORKSPACE/artifacts/candidate_m2z1.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: outcome-policy-v1-m2z1
          path: artifacts/candidate_m2z1.json
          retention-days: 30

  report:
    needs: [candidate_train, evaluate_random, evaluate_counterfactual, candidate_m2z1]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: outcome-policy-v1-candidate
          path: candidate
      - uses: actions/download-artifact@v4
        with:
          pattern: outcome-policy-v1-random-*
          path: random-shards
      - uses: actions/download-artifact@v4
        with:
          pattern: outcome-policy-v1-counterfactual-*
          path: counterfactual-shards
      - uses: actions/download-artifact@v4
        with:
          name: outcome-policy-v1-m2z1
          path: diagnostics/candidate
      - uses: actions/download-artifact@v4
        with:
          name: spatial-policy-v1-report
          path: baseline-report
          repository: Sanghvimanav/godot-hex-strategy-game
          run-id: ${{ env.BASE_POLICY_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Merge and summarize
        run: |
          python hex-strategy-game/tools/merge_ai_arena.py --input-root random-shards --out artifacts/random
          python hex-strategy-game/tools/merge_ai_arena.py --input-root counterfactual-shards --out artifacts/counterfactual
          python - <<'PY'
          import json
          from pathlib import Path
          random = json.loads(Path('artifacts/random/manifest.json').read_text())
          cf = json.loads(Path('artifacts/counterfactual/manifest.json').read_text())
          m2z1 = json.loads(Path('diagnostics/candidate/candidate_m2z1.json').read_text())
          training = json.loads(Path('candidate/outcome_policy_metrics.json').read_text())
          baseline = json.loads(Path('baseline-report/spatial_policy_v1_summary.json').read_text())
          summary = {
              'experiment': 'outcome_policy_v1',
              'objective': 'signed_self_play_outcome_policy_gradient',
              'base_policy_run_id': 34799925923,
              'source_data_run_id': 34784986112,
              'training': training,
              'baseline_spatial_v1': {
                  'random': baseline['candidate_random'],
                  'counterfactual': baseline['candidate_counterfactual'],
                  'm2z1': baseline['m2z1'],
              },
              'candidate': {
                  'random': {
                      'counts': random['counts'],
                      'family_counts': random['family_counts'],
                      'faction_counts': random.get('challenger_faction_counts', {}),
                      'pair_counts': random.get('pair_counts', {}),
                  },
                  'counterfactual': {
                      'counts': cf['counts'],
                      'family_counts': cf['family_counts'],
                  },
                  'm2z1': {
                      'robust_terran_wins': m2z1['robust_terran_wins'],
                      'mcts_terran_wins': m2z1['puct_terran_wins'],
                  },
              },
          }
          Path('artifacts/outcome_policy_v1_summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          print(json.dumps(summary, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: outcome-policy-v1-report
          path: artifacts/
          retention-days: 30
