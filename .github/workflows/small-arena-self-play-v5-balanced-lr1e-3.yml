  report:
    name: Build self-play learning curve
    needs: [eval_g0, eval_g1, eval_g2, eval_g3, eval_g4, eval_g5]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: small-selfplay-v5-balanced-eval-g*-s*
          path: eval-shards
      - uses: actions/download-artifact@v4
        with:
          pattern: small-selfplay-v5-balanced-g*
          path: checkpoints
      - name: Summarize heuristic benchmark progression
        run: |
          mkdir -p artifacts/report
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[]
          for gen in range(6):
              manifests=[json.loads(p.read_text()) for p in sorted(Path("eval-shards").glob(f"small-selfplay-v5-balanced-eval-g{gen}-s*/manifest.json"))]
              assert len(manifests)==4,(gen,len(manifests))
              games=[g for m in manifests for g in m["games"]]
              assert len(games)==160,(gen,len(games))
              counts={k:0 for k in ["win","loss","draw","unresolved","failed"]}
              matchup={}
              faction={}
              for g in games:
                  if not g["valid"]: bucket="failed"
                  elif g["status"]=="turn_limit": bucket="unresolved"
                  elif g["neural_outcome"]>0: bucket="win"
                  elif g["neural_outcome"]<0: bucket="loss"
                  else: bucket="draw"
                  counts[bucket]+=1
                  matchup.setdefault(g["matchup"],{k:0 for k in counts})[bucket]+=1
                  faction.setdefault(g["neural_group"],{k:0 for k in counts})[bucket]+=1
              decisive=counts["win"]+counts["loss"]
              row={"generation":gen,"games":160,"counts":counts,
                   "decisive_win_rate":counts["win"]/decisive if decisive else 0,
                   "matchup_counts":matchup,"faction_counts":faction}
              if gen>0:
                  m=json.loads(Path(f"checkpoints/small-selfplay-v5-balanced-g{gen}/training_metrics.json").read_text())
                  row.update(
                      ppo_clipped_fraction=m["ppo_clipped_fraction"],
                      policy_entropy_after=m["policy_after"]["mean_entropy"],
                      mean_advantage=m["mean_advantage"],
                      mean_abs_advantage=m["mean_abs_advantage"],
                      value_mse_after=m["value_after"]["mse"],
                      policy_learning_rate=m["policy_learning_rate"],
                  )
              rows.append(row)
          Path("artifacts/report/learning_curve.json").write_text(json.dumps(rows,indent=2)+"\n")
          lines=[
              "# Small Arena Self-Play V5 Balanced",
              "",
              "Training: current checkpoint vs itself, radius 1, uniform 1-3 Marines vs 1-4 Zerglings, 10-turn cap, policy LR 1e-3.",
              "Evaluation: fixed 160-game greedy benchmark vs frozen handwritten heuristic after every generation.",
              "",
              "| Gen | Neural wins | Heuristic wins | Draw | Unresolved | Decisive win rate | Entropy | PPO clipped |",
              "| ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: |",
          ]
          for r in rows:
              if r["generation"]==0:
                  lines.append(f"| 0 | {r['counts']['win']} | {r['counts']['loss']} | {r['counts']['draw']} | {r['counts']['unresolved']} | {r['decisive_win_rate']:.1%} |  |  |")
              else:
                  lines.append(f"| {r['generation']} | {r['counts']['win']} | {r['counts']['loss']} | {r['counts']['draw']} | {r['counts']['unresolved']} | {r['decisive_win_rate']:.1%} | {r['policy_entropy_after']:.3f} | {r['ppo_clipped_fraction']:.1%} |")
          summary="\n".join(lines)+"\n"
          Path("artifacts/report/summary.md").write_text(summary)
          with Path(__import__("os").environ["GITHUB_STEP_SUMMARY"]).open("a") as h:
              h.write(summary)
          print(summary)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: small-selfplay-v5-balanced-learning-curve
          path: artifacts/report/
          retention-days: 30
