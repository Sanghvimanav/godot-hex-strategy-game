name: Small Arena Self-Play V5 Balanced LR 1e-3

on:
  workflow_dispatch:
  push:
    branches: [ai/heuristic-champion-generations]
    paths: [.github/small-selfplay-v5-balanced-lr1e-3-trigger]

permissions:
  contents: read
  actions: read

concurrency:
  group: small-selfplay-v5-balanced-lr1e-3-${{ github.ref }}
  cancel-in-progress: true

env:
  SEED_RUN_ID: '34799925923'

jobs:
  validate:
    name: Validate self-play contract
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: 4.6.0
          use-dotnet: false
          include-templates: false
      - name: Import Godot project
        working-directory: hex-strategy-game
        run: godot --headless --import
      - uses: actions/download-artifact@v4
        with:
          name: spatial-policy-v1-candidate
          path: checkpoint
          repository: Sanghvimanav/godot-hex-strategy-game
          run-id: ${{ env.SEED_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Generate 12 contract games
        working-directory: hex-strategy-game
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts/validate"
          godot --headless --path . res://tools/small_arena_self_play_generation_v5.tscn -- \
            --checkpoint="$GITHUB_WORKSPACE/checkpoint/spatial_policy_v1_model.pt" \
            --game-count=12 \
            --generation=0 \
            --shard-index=0 \
            --seed-base=12000000 \
            --temperature=1.0 \
            --max-turns=10 \
            --out="$GITHUB_WORKSPACE/artifacts/validate"
      - name: Audit contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("artifacts/validate/manifest.json").read_text())
          games=[json.loads(x) for x in Path("artifacts/validate/games.jsonl").read_text().splitlines() if x.strip()]
          policy=[json.loads(x) for x in Path("artifacts/validate/policy_steps.jsonl").read_text().splitlines() if x.strip()]
          values=[json.loads(x) for x in Path("artifacts/validate/value_examples.jsonl").read_text().splitlines() if x.strip()]
          assert m["training_opponent"]=="current_policy_self_play",m
          assert m["same_checkpoint_both_factions"] is True,m
          assert m["hex_radius"]==1,m
          assert m["allowed_unit_types"]==["marine","zergling"],m
          matchups=[f"{m}v{z}" for z in range(1,5) for m in range(1,4)]
          counts={k:sum(g["matchup"]==k for g in games) for k in matchups}
          assert counts=={k:1 for k in matchups},counts
          assert m["max_turns"]==10,m
          assert m["matchup_distribution"]=="uniform_1to3_marines_vs_1to4_zerglings",m
          assert {r["perspective_group"] for r in policy}=={"terran","zerg"}
          assert {r["perspective_group"] for r in values}=={"terran","zerg"}
          print(json.dumps({"matchups":counts,"policy_steps":len(policy),"value_examples":len(values)},indent=2))
          PY

  eval_g0:
    name: Gen 0 heuristic eval shard ${{ matrix.shard }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: 4.6.0
          use-dotnet: false
          include-templates: false
      - name: Import Godot project
        working-directory: hex-strategy-game
        run: godot --headless --import
      - uses: actions/download-artifact@v4
        with:
          name: spatial-policy-v1-candidate
          path: checkpoint
          repository: Sanghvimanav/godot-hex-strategy-game
          run-id: ${{ env.SEED_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Fixed greedy evaluation vs frozen heuristic
        working-directory: hex-strategy-game
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts/eval"
          seed_base=$((13100000 + ${{ matrix.shard }} * 100000))
          godot --headless --path . res://tools/small_arena_self_play_eval_v5.tscn -- \
            --checkpoint="$GITHUB_WORKSPACE/checkpoint/spatial_policy_v1_model.pt" \
            --base-games=20 \
            --generation=0 \
            --shard-index="${{ matrix.shard }}" \
            --seed-base="$seed_base" \
            --max-turns=10 \
            --out="$GITHUB_WORKSPACE/artifacts/eval"
      - uses: actions/upload-artifact@v4
        with:
          name: small-selfplay-v5-balanced-eval-g0-s${{ matrix.shard }}
          path: artifacts/eval/
          retention-days: 30

  data_g1:
    name: Gen 1 self-play shard ${{ matrix.shard }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: 4.6.0
          use-dotnet: false
          include-templates: false
      - name: Import Godot project
        working-directory: hex-strategy-game
        run: godot --headless --import
      - uses: actions/download-artifact@v4
        with:
          name: spatial-policy-v1-candidate
          path: checkpoint
          repository: Sanghvimanav/godot-hex-strategy-game
          run-id: ${{ env.SEED_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Generate current-policy self-play
        working-directory: hex-strategy-game
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts/data"
          seed_base=$((12100000 + 1 * 1000000 + ${{ matrix.shard }} * 100000))
          godot --headless --path . res://tools/small_arena_self_play_generation_v5.tscn -- \
            --checkpoint="$GITHUB_WORKSPACE/checkpoint/spatial_policy_v1_model.pt" \
            --game-count=80 \
            --generation=1 \
            --shard-index="${{ matrix.shard }}" \
            --seed-base="$seed_base" \
            --temperature=1.0 \
            --max-turns=10 \
            --out="$GITHUB_WORKSPACE/artifacts/data"
      - uses: actions/upload-artifact@v4
        with:
          name: small-selfplay-v5-balanced-train-g1-s${{ matrix.shard }}
          path: artifacts/data/
          retention-days: 30

  train_g1:
    name: Train generation 1
    needs: data_g1
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - uses: actions/download-artifact@v4
        with:
          name: spatial-policy-v1-candidate
          path: checkpoint
          repository: Sanghvimanav/godot-hex-strategy-game
          run-id: ${{ env.SEED_RUN_ID }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: small-selfplay-v5-balanced-train-g1-s*
          path: generation-shards
      - name: Merge and audit fresh self-play generation
        run: |
          mkdir -p artifacts/combined artifacts/output
          find generation-shards -name policy_steps.jsonl -print | sort | xargs cat > artifacts/combined/policy_steps.jsonl
          find generation-shards -name value_examples.jsonl -print | sort | xargs cat > artifacts/combined/value_examples.jsonl
          find generation-shards -name games.jsonl -print | sort | xargs cat > artifacts/combined/games.jsonl
          python - <<'PY'
          import json
          from pathlib import Path
          games=[json.loads(x) for x in Path("artifacts/combined/games.jsonl").read_text().splitlines() if x.strip()]
          policy=[json.loads(x) for x in Path("artifacts/combined/policy_steps.jsonl").read_text().splitlines() if x.strip()]
          values=[json.loads(x) for x in Path("artifacts/combined/value_examples.jsonl").read_text().splitlines() if x.strip()]
          assert len(games)==480,len(games)
          assert len({g["game_id"] for g in games})==480
          assert len({g["scenario_seed"] for g in games})==480
          matchups=[f"{m}v{z}" for z in range(1,5) for m in range(1,4)]
          counts={k:sum(g["matchup"]==k for g in games) for k in matchups}
          assert counts=={k:40 for k in matchups},counts
          assert {int(x["generation"]) for x in policy}=={1}
          assert {str(x["perspective_group"]) for x in policy}=={"terran","zerg"}
          assert {int(x["source"]["generation"]) for x in values}=={1}
          assert {str(x["perspective_group"]) for x in values}=={"terran","zerg"}
          for row in policy[:1000]:
              state=row["state"]
              assert state["hex_radius"]==1
              defs={u["def_path"].split("/")[-1] for group in state["groups"] for u in group["units"]}
              assert defs <= {"marine.tres","zergling.tres"},defs
          print(json.dumps({"games":len(games),"matchups":counts,"policy_steps":len(policy),"value_examples":len(values)},indent=2))
          PY
      - name: One PPO pass at policy LR 1e-3
        run: |
          python -m ml.value_model.train_outcome_actor_critic \
            --base-checkpoint="checkpoint/spatial_policy_v1_model.pt" \
            --policy-steps=artifacts/combined/policy_steps.jsonl \
            --value-examples=artifacts/combined/value_examples.jsonl \
            --output=artifacts/output/model.pt \
            --value-learning-rate=1e-4 \
            --policy-learning-rate=1e-3 \
            --entropy-beta=0.01 \
            --ppo-clip=0.2 \
            --training-opponent=current_policy_self_play \
            --seed=1 \
            --device=cpu \
            | tee artifacts/output/training_metrics.json
      - name: Audit training invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("artifacts/output/training_metrics.json").read_text())
          assert m["training_passes"]==1 and m["epochs"]==0,m
          assert m["mcts_used"] is False,m
          assert m["training_opponent"]=="current_policy_self_play",m
          assert m["shared_spatial_encoder_frozen"] is True,m
          assert abs(m["ppo_clip"]-0.2)<1e-9,m
          assert abs(m["policy_learning_rate"]-1e-3)<1e-12,m
          assert m["vocab_expansion"]["new_unit_tokens"]==[],m["vocab_expansion"]
          assert m["vocab_expansion"]["new_action_tokens"]==[],m["vocab_expansion"]
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: small-selfplay-v5-balanced-g1
          path: artifacts/output/
          retention-days: 30

