          path: artifacts/eval/
          retention-days: 30

  report:
    name: Build five-generation learning curve
    needs: [eval_g0, eval_g1, eval_g2, eval_g3, eval_g4, eval_g5]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: heuristic-eval-g*-s*
          path: eval-shards
      - uses: actions/download-artifact@v4
        with:
          pattern: heuristic-champion-g*
          path: checkpoints
      - name: Summarize learning curve
        run: |
          mkdir -p artifacts/report
          python - <<'PY'
          import json
          from pathlib import Path

          rows=[]
          for gen in range(6):
              manifests=[]
              for path in sorted(Path("eval-shards").glob(f"heuristic-eval-g{gen}-s*/manifest.json")):
                  manifests.append(json.loads(path.read_text()))
              assert len(manifests) == 6, (gen, len(manifests))
              counts={key:sum(int(m["counts"][key]) for m in manifests) for key in ["win","loss","draw","failed"]}
              decisive=counts["win"]+counts["loss"]
              row={
                  "generation":gen,
                  "evaluation_games":sum(int(m["actual_games"]) for m in manifests),
                  "wins":counts["win"],
                  "losses":counts["loss"],
                  "draws":counts["draw"],
                  "failed":counts["failed"],
                  "decisive_win_rate":counts["win"]/decisive if decisive else 0.0,
              }
              if gen>0:
                  metrics_path=Path(f"checkpoints/heuristic-champion-g{gen}/training_metrics.json")
                  metrics=json.loads(metrics_path.read_text())
                  row["training_games"]=1008
                  row["training_passes"]=metrics["training_passes"]
                  row["epochs"]=metrics["epochs"]
                  row["mean_abs_advantage"]=metrics["mean_abs_advantage"]
                  row["value_mse_before"]=metrics["value_before"]["mse"]
                  row["value_mse_after"]=metrics["value_after"]["mse"]
                  row["policy_entropy_after"]=metrics["policy_after"]["mean_entropy"]
              rows.append(row)

          assert all(r["failed"] == 0 for r in rows), rows
          assert all(r.get("training_passes",1) == 1 for r in rows[1:]), rows
          assert all(r.get("epochs",0) == 0 for r in rows[1:]), rows

          Path("artifacts/report/learning_curve.json").write_text(json.dumps(rows,indent=2)+"\n")
          lines=[
              "# Direct neural policy vs frozen handwritten champion",
              "",
              "Training games: 1,008 fresh games/generation × 5 = 5,040 total.",
              "Evaluation: 180 fresh greedy games/checkpoint.",
              "Optimization: exactly one update pass/generation; no epoch loop.",
              "Policy target: Monte Carlo final outcome advantage; no MCTS targets.",
              "",
              "| Gen | Wins | Losses | Draws | Decisive win rate |",
              "| ---: | ---: | ---: | ---: | ---: |",
          ]
          for r in rows:
              lines.append(f"| {r['generation']} | {r['wins']} | {r['losses']} | {r['draws']} | {r['decisive_win_rate']:.1%} |")
          summary="\n".join(lines)+"\n"
          Path("artifacts/report/summary.md").write_text(summary)
          with Path(__import__("os").environ["GITHUB_STEP_SUMMARY"]).open("a") as h:
              h.write(summary)
          print(summary)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: heuristic-champion-learning-curve
          path: artifacts/report/
          retention-days: 30
