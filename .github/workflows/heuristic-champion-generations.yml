name: Heuristic Champion Generations

on:
  workflow_dispatch:
  push:
    branches: [ai/heuristic-champion-generations]
    paths: [.github/heuristic-champion-generations-trigger]

permissions:
  contents: read
  actions: read

concurrency:
  group: heuristic-champion-main-${{ github.ref }}
  cancel-in-progress: true

env:
  SEED_RUN_ID: '34799925923'

jobs:
  eval_g0:
    name: Evaluate generation 0 shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: 4.6.0
          use-dotnet: false
          include-templates: false
      - name: Import Godot project
        working-directory: hex-strategy-game
        run: godot --headless --import

      - uses: actions/download-artifact@v4
        with:
          name: spatial-policy-v1-candidate
          path: checkpoint
          repository: Sanghvimanav/godot-hex-strategy-game
          run-id: ${{ env.SEED_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Fresh greedy arena vs frozen heuristic
        working-directory: hex-strategy-game
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts/eval"
          seed_base=$((910000 + 0 * 10000 + ${{ matrix.shard }} * 100000))
          godot --headless --path . res://tools/heuristic_champion_generation.tscn -- \
            --checkpoint="$GITHUB_WORKSPACE/checkpoint/spatial_policy_v1_model.pt" \
            --base-games=15 \
            --generation=0 \
            --seed-base="$seed_base" \
            --temperature=0 \
            --record-training=false \
            --out="$GITHUB_WORKSPACE/artifacts/eval"
      - uses: actions/upload-artifact@v4
        with:
          name: heuristic-eval-g0-s${{ matrix.shard }}
          path: artifacts/eval/
          retention-days: 30

  data_g1:
    name: Generation 1 games shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: 4.6.0
          use-dotnet: false
          include-templates: false
      - name: Import Godot project
        working-directory: hex-strategy-game
        run: godot --headless --import

      - uses: actions/download-artifact@v4
        with:
          name: spatial-policy-v1-candidate
          path: checkpoint
          repository: Sanghvimanav/godot-hex-strategy-game
          run-id: ${{ env.SEED_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Generate direct-policy games vs frozen heuristic
        working-directory: hex-strategy-game
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts/data"
          seed_base=$((710000 + 1 * 10000 + ${{ matrix.shard }} * 100000))
          godot --headless --path . res://tools/heuristic_champion_generation.tscn -- \
            --checkpoint="$GITHUB_WORKSPACE/checkpoint/spatial_policy_v1_model.pt" \
            --base-games=84 \
            --generation=1 \
            --seed-base="$seed_base" \
            --temperature=1.0 \
            --record-training=true \
            --out="$GITHUB_WORKSPACE/artifacts/data"
      - uses: actions/upload-artifact@v4
        with:
          name: heuristic-train-g1-s${{ matrix.shard }}
          path: artifacts/data/
          retention-days: 30

  train_g1:
    name: Train generation 1
    needs: data_g1
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - uses: actions/download-artifact@v4
        with:
          name: spatial-policy-v1-candidate
          path: checkpoint
          repository: Sanghvimanav/godot-hex-strategy-game
          run-id: ${{ env.SEED_RUN_ID }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: heuristic-train-g1-s*
          path: generation-shards
      - name: Merge fresh generation
        run: |
          mkdir -p artifacts/combined artifacts/output
          find generation-shards -name policy_steps.jsonl -print | sort | xargs cat > artifacts/combined/policy_steps.jsonl
          find generation-shards -name value_examples.jsonl -print | sort | xargs cat > artifacts/combined/value_examples.jsonl
          python - <<'PY'
          import json
          from pathlib import Path
          policy = [json.loads(x) for x in Path("artifacts/combined/policy_steps.jsonl").read_text().splitlines() if x.strip()]
          values = [json.loads(x) for x in Path("artifacts/combined/value_examples.jsonl").read_text().splitlines() if x.strip()]
          assert policy and values
          assert {int(x["generation"]) for x in policy} == {1}
          assert {int(x["source"]["generation"]) for x in values} == {1}
          print(json.dumps({"policy_steps": len(policy), "value_examples": len(values)}))
          PY
      - name: One outcome update pass
        run: |
          python -m ml.value_model.train_outcome_actor_critic \
            --base-checkpoint="checkpoint/spatial_policy_v1_model.pt" \
            --policy-steps=artifacts/combined/policy_steps.jsonl \
            --value-examples=artifacts/combined/value_examples.jsonl \
            --output=artifacts/output/model.pt \
            --value-learning-rate=1e-4 \
            --policy-learning-rate=1e-4 \
            --entropy-beta=0.01 \
            --seed=1 \
            --device=cpu \
            | tee artifacts/output/training_metrics.json
      - name: Assert no epoch loop
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("artifacts/output/training_metrics.json").read_text())
          assert m["training_passes"] == 1, m
          assert m["epochs"] == 0, m
          assert m["mcts_used"] is False, m
          assert m["training_opponent"] == "frozen_handwritten", m
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: heuristic-champion-g1
          path: artifacts/output/
          retention-days: 30

