  report:
    name: Build primary arena learning curve
    needs: [arena_g0, arena_g1, arena_g2, arena_g3, arena_g4, arena_g5]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: heuristic-arena-eval-g*-s*
          path: arena-shards
      - uses: actions/download-artifact@v4
        with:
          pattern: heuristic-arena-g*
          path: checkpoints
      - name: Summarize full-arena progression
        run: |
          mkdir -p artifacts/report
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[]
          for gen in range(6):
              manifests=[json.loads(p.read_text()) for p in sorted(Path("arena-shards").glob(f"heuristic-arena-eval-g{gen}-s*/manifest.json"))]
              assert len(manifests)==8,(gen,len(manifests))
              games=[g for m in manifests for g in m["games"]]
              assert len(games)==64,(gen,len(games))
              counts={k:sum(1 for g in games if g["winner_agent"]==k) for k in ["challenger","champion","draw","unresolved","failed"]}
              decisive=counts["challenger"]+counts["champion"]
              pairs={}
              for g in games: pairs.setdefault(g["pair_id"],[]).append(g)
              pc={"challenger":0,"champion":0,"tie":0,"unresolved":0}
              for rs in pairs.values():
                  if len(rs)!=2 or any(r["winner_agent"]=="unresolved" for r in rs):
                      pc["unresolved"]+=1; continue
                  pts=sum(1 if r["winner_agent"]=="challenger" else .5 if r["winner_agent"]=="draw" else 0 for r in rs)
                  pc["challenger" if pts>1 else "champion" if pts<1 else "tie"]+=1
              family={}
              faction={}
              for g in games:
                  family.setdefault(g["base_scenario_id"],{"challenger":0,"champion":0,"draw":0,"unresolved":0})
                  faction.setdefault(g["challenger_group"],{"challenger":0,"champion":0,"draw":0,"unresolved":0})
                  family[g["base_scenario_id"]][g["winner_agent"]]+=1
                  faction[g["challenger_group"]][g["winner_agent"]]+=1
              row={"generation":gen,"games":64,"counts":counts,"decisive_win_rate":counts["challenger"]/decisive if decisive else 0,"pair_counts":pc,"family_counts":family,"faction_counts":faction}
              if gen>0:
                  m=json.loads(Path(f"checkpoints/heuristic-arena-g{gen}/training_metrics.json").read_text())
                  row["ppo_clipped_fraction"]=m["ppo_clipped_fraction"]
                  row["policy_entropy_after"]=m["policy_after"]["mean_entropy"]
                  row["value_mse_after"]=m["value_after"]["mse"]
              rows.append(row)
          Path("artifacts/report/learning_curve.json").write_text(json.dumps(rows,indent=2)+"\n")
          lines=[
              "# Primary learning curve: full randomized arena vs frozen heuristic",
              "",
              "Direct neural policy has no search. Champion is balanced handwritten opponent-response search.",
              "Training uses fresh generated arena states; evaluation uses the fixed 32-pair full arena.",
              "",
              "| Gen | Neural wins | Heuristic wins | Draw | Unresolved | Decisive win rate | Pair wins |",
              "| ---: | ---: | ---: | ---: | ---: | ---: | ---: |",
          ]
          for r in rows:
              lines.append(f"| {r['generation']} | {r['counts']['challenger']} | {r['counts']['champion']} | {r['counts']['draw']} | {r['counts']['unresolved']} | {r['decisive_win_rate']:.1%} | {r['pair_counts']['challenger']} |")
          summary="\n".join(lines)+"\n"
          Path("artifacts/report/summary.md").write_text(summary)
          with Path(__import__("os").environ["GITHUB_STEP_SUMMARY"]).open("a") as h: h.write(summary)
          print(summary)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: heuristic-arena-v2-learning-curve
          path: artifacts/report/
          retention-days: 30
