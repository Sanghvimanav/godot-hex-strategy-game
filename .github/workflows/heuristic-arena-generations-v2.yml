name: Heuristic Arena Generations V2

on:
  workflow_dispatch:
  push:
    branches: [ai/heuristic-champion-generations]
    paths: [.github/heuristic-arena-generations-v2-trigger]

permissions:
  contents: read
  actions: read

concurrency:
  group: heuristic-arena-generations-v2-${{ github.ref }}
  cancel-in-progress: true

env:
  SEED_RUN_ID: '34799925923'

jobs:
  arena_g0:
    name: Gen 0 primary full arena shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: 4.6.0
          use-dotnet: false
          include-templates: false
      - name: Import Godot project
        working-directory: hex-strategy-game
        run: godot --headless --import

      - uses: actions/download-artifact@v4
        with:
          name: spatial-policy-v1-candidate
          path: checkpoint
          repository: Sanghvimanav/godot-hex-strategy-game
          run-id: ${{ env.SEED_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Full arena direct policy vs heuristic champion
        working-directory: hex-strategy-game
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts/arena"
          godot --headless --path . res://tools/ai_arena.tscn -- \
            --preset=full \
            --map-profile=compact_v1 \
            --champion-profile=balanced \
            --challenger-profile=fast \
            --champion-evaluator=handwritten \
            --challenger-evaluator=neural \
            --champion-policy=opponent_response \
            --challenger-policy=direct_neural \
            --checkpoint="$GITHUB_WORKSPACE/checkpoint/spatial_policy_v1_model.pt" \
            --direct-temperature=0 \
            --rules-version="${GITHUB_SHA}" \
            --out="$GITHUB_WORKSPACE/artifacts/arena" \
            --shard-index="${{ matrix.shard }}" \
            --shard-count=8
      - uses: actions/upload-artifact@v4
        with:
          name: heuristic-arena-eval-g0-s${{ matrix.shard }}
          path: artifacts/arena/
          retention-days: 30

  data_g1:
    name: Generation 1 randomized training shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: 4.6.0
          use-dotnet: false
          include-templates: false
      - name: Import Godot project
        working-directory: hex-strategy-game
        run: godot --headless --import

      - uses: actions/download-artifact@v4
        with:
          name: spatial-policy-v1-candidate
          path: checkpoint
          repository: Sanghvimanav/godot-hex-strategy-game
          run-id: ${{ env.SEED_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Generate randomized arena-state games
        working-directory: hex-strategy-game
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts/data"
          seed_base=$((7100000 + 1 * 1000000 + ${{ matrix.shard }} * 100000))
          godot --headless --path . res://tools/heuristic_arena_generation.tscn -- \
            --checkpoint="$GITHUB_WORKSPACE/checkpoint/spatial_policy_v1_model.pt" \
            --base-games=84 \
            --generation=1 \
            --shard-index="${{ matrix.shard }}" \
            --seed-base="$seed_base" \
            --temperature=1.0 \
            --map-profile=compact_v1 \
            --champion-profile=balanced \
            --out="$GITHUB_WORKSPACE/artifacts/data"
      - uses: actions/upload-artifact@v4
        with:
          name: heuristic-arena-train-g1-s${{ matrix.shard }}
          path: artifacts/data/
          retention-days: 30

  train_g1:
    name: Train generation 1
    needs: data_g1
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - uses: actions/download-artifact@v4
        with:
          name: spatial-policy-v1-candidate
          path: checkpoint
          repository: Sanghvimanav/godot-hex-strategy-game
          run-id: ${{ env.SEED_RUN_ID }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: heuristic-arena-train-g1-s*
          path: generation-shards
      - name: Merge fresh generation and audit IDs
        run: |
          mkdir -p artifacts/combined artifacts/output
          find generation-shards -name policy_steps.jsonl -print | sort | xargs cat > artifacts/combined/policy_steps.jsonl
          find generation-shards -name value_examples.jsonl -print | sort | xargs cat > artifacts/combined/value_examples.jsonl
          find generation-shards -name games.jsonl -print | sort | xargs cat > artifacts/combined/games.jsonl
          python - <<'PY'
          import json
          from pathlib import Path
          games=[json.loads(x) for x in Path("artifacts/combined/games.jsonl").read_text().splitlines() if x.strip()]
          policy=[json.loads(x) for x in Path("artifacts/combined/policy_steps.jsonl").read_text().splitlines() if x.strip()]
          values=[json.loads(x) for x in Path("artifacts/combined/value_examples.jsonl").read_text().splitlines() if x.strip()]
          ids=[g["game_id"] for g in games]
          assert len(games)==1008, len(games)
          assert len(ids)==len(set(ids)), (len(ids),len(set(ids)))
          assert {int(x["generation"]) for x in policy}=={1}
          assert {int(x["source"]["generation"]) for x in values}=={1}
          assert len({g["scenario_seed"] for g in games})==504
          print(json.dumps({"games":len(games),"unique_game_ids":len(set(ids)),"unique_states":len({g["scenario_seed"] for g in games}),"policy_steps":len(policy),"value_examples":len(values)}))
          PY
      - name: One clipped outcome update pass
        run: |
          python -m ml.value_model.train_outcome_actor_critic \
            --base-checkpoint="checkpoint/spatial_policy_v1_model.pt" \
            --policy-steps=artifacts/combined/policy_steps.jsonl \
            --value-examples=artifacts/combined/value_examples.jsonl \
            --output=artifacts/output/model.pt \
            --value-learning-rate=1e-4 \
            --policy-learning-rate=1e-4 \
            --entropy-beta=0.01 \
            --ppo-clip=0.2 \
            --seed=1 \
            --device=cpu \
            | tee artifacts/output/training_metrics.json
      - name: Audit training invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("artifacts/output/training_metrics.json").read_text())
          assert m["training_passes"]==1 and m["epochs"]==0, m
          assert m["mcts_used"] is False, m
          assert m["training_opponent"]=="frozen_handwritten", m
          assert m["shared_spatial_encoder_frozen"] is True, m
          assert abs(m["ppo_clip"]-0.2)<1e-9, m
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: heuristic-arena-g1
          path: artifacts/output/
          retention-days: 30

