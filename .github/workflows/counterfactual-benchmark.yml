name: Counterfactual Benchmark

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/counterfactual-benchmark.yml"
      - "hex-strategy-game/src/simulation/pure_state_counterfactual_*.gd"
      - "hex-strategy-game/tests/test_pure_state_counterfactual_*.gd"
      - "hex-strategy-game/tools/counterfactual_benchmark.*"
      - "hex-strategy-game/tools/run_counterfactual_benchmark.sh"

permissions:
  contents: read

concurrency:
  group: counterfactual-benchmark-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-benchmark:
    if: github.event_name == 'pull_request'
    name: Focused PR benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Godot 4.6
        uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: 4.6.0
          use-dotnet: false
          include-templates: false

      - name: Import Godot project
        working-directory: hex-strategy-game
        run: godot --headless --import

      - name: Run curated counterfactual suite
        shell: bash
        run: |
          set -euo pipefail
          out="${GITHUB_WORKSPACE}/artifacts/pr-curated"
          cd hex-strategy-game
          timeout 15m bash tools/run_counterfactual_benchmark.sh \
            --preset=curated \
            --out="${out}"

      - name: Audit focused benchmark
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path("artifacts/pr-curated")
          manifest = json.loads((root / "manifest.json").read_text())
          rows = [
              json.loads(line)
              for line in (root / "candidates.jsonl").read_text().splitlines()
              if line.strip()
          ]
          assert manifest["decisions_requested"] > 0, manifest
          assert manifest["decisions_failed"] == 0, manifest
          assert manifest["candidate_count"] == len(rows), (manifest, len(rows))
          assert manifest["candidate_count"] > 0, manifest
          assert manifest["target_semantics"] == "search_policy_terminal_return_with_unresolved_bounds_v2"
          assert manifest["opponent_weight_semantics"] == "normalized_search_policy_proxy_not_empirical_behavior_probability"
          assert manifest["turn_limit_is_unlabeled"] is True
          widths = []
          for row in rows:
              assert row["decision_id"]
              assert row["candidate_id"]
              assert row["assumptions"]["rules_version"] != "unknown"
              assert row["assumptions"]["opponent_policy_computed_once_from_pre_turn_state"] is True
              estimate = row["target_estimate"]
              coverage = estimate["labeled_weight_fraction"]
              lower = estimate["full_mixture_lower_bound"]
              upper = estimate["full_mixture_upper_bound"]
              known = estimate["known_weighted_return_contribution"]
              assert 0.0 <= coverage <= 1.0
              assert -1.0 <= lower <= upper <= 1.0, estimate
              assert lower - 1e-9 <= known <= upper + 1e-9, estimate
              assert "conditional_labeled_mean_return" in estimate
              assert "best_response_value_lower_bound" in estimate
              assert "best_response_value_upper_bound" in estimate
              widths.append(upper - lower)

          mean_width = sum(widths) / len(widths)
          summary = (
              "## Focused counterfactual PR benchmark\n\n"
              f"- Decisions: {manifest['decisions_requested']}\n"
              f"- Candidates: {manifest['candidate_count']}\n"
              f"- Fully labeled: {manifest['fully_labeled_candidates']}\n"
              f"- Partially labeled: {manifest['partially_labeled_candidates']}\n"
              f"- Unlabeled: {manifest['unlabeled_candidates']}\n"
              f"- Mean full-mixture interval width: {mean_width:.3f}\n"
              f"- Opponent weighting: `{manifest['opponent_weight_semantics']}`\n"
              f"- Continuation mixture: `{manifest['continuation_mixture_version']}`\n"
          )
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as handle:
              handle.write(summary)
          print(json.dumps(manifest, indent=2, sort_keys=True))
          PY

      - name: Upload focused benchmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: counterfactual-pr-curated-${{ github.run_number }}
          path: artifacts/pr-curated/
          if-no-files-found: warn
          retention-days: 14

  full-benchmark:
    if: github.event_name == 'workflow_dispatch'
    name: Benchmark ${{ matrix.case_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - case_id: smoke
            preset: smoke
            decision_id: ""
          - case_id: collapse-zerg
            preset: starter
            decision_id: cf-collapse-zerg
          - case_id: baneling-finish-zerg
            preset: starter
            decision_id: cf-baneling-finish-zerg
          - case_id: marine-spread-terran
            preset: starter
            decision_id: cf-marine-spread-terran
          - case_id: curated-sacrifice
            preset: curated
            decision_id: curated-sacrifice-baneling
          - case_id: curated-preservation
            preset: curated
            decision_id: curated-preserve-wounded-scout
          - case_id: curated-spreading
            preset: curated
            decision_id: curated-spread-marine-screen
          - case_id: curated-retreating
            preset: curated
            decision_id: curated-retreat-wounded-marine
          - case_id: curated-trapped-zergling
            preset: curated
            decision_id: curated-trapped-zergling-last-kill
          - case_id: curated-production-pressure
            preset: curated
            decision_id: curated-attack-zerg-production-early
          - case_id: curated-coordinated-commitment
            preset: curated
            decision_id: curated-coordinate-fire-lanes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Godot 4.6
        uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: 4.6.0
          use-dotnet: false
          include-templates: false

      - name: Import Godot project
        working-directory: hex-strategy-game
        run: godot --headless --import

      - name: Run benchmark case
        shell: bash
        env:
          CASE_ID: ${{ matrix.case_id }}
          PRESET: ${{ matrix.preset }}
          DECISION_ID: ${{ matrix.decision_id }}
        run: |
          set -euo pipefail
          out="${GITHUB_WORKSPACE}/artifacts/${CASE_ID}"
          args=(--preset="${PRESET}" --out="${out}")
          if [[ -n "${DECISION_ID}" ]]; then
            args+=(--decision-id="${DECISION_ID}")
          fi
          cd hex-strategy-game
          timeout 15m bash tools/run_counterfactual_benchmark.sh "${args[@]}"

      - name: Audit benchmark case
        env:
          CASE_ID: ${{ matrix.case_id }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          case_id = os.environ["CASE_ID"]
          root = Path("artifacts") / case_id
          manifest = json.loads((root / "manifest.json").read_text())
          rows = [json.loads(line) for line in (root / "candidates.jsonl").read_text().splitlines() if line.strip()]
          assert manifest["decisions_failed"] == 0, manifest
          assert manifest["decisions_requested"] == 1, manifest
          assert manifest["candidate_count"] == len(rows), (manifest, len(rows))
          assert manifest["candidate_count"] > 0, manifest
          assert manifest["target_semantics"] == "search_policy_terminal_return_with_unresolved_bounds_v2"
          assert manifest["opponent_weight_semantics"] == "normalized_search_policy_proxy_not_empirical_behavior_probability"
          assert manifest["turn_limit_is_unlabeled"] is True
          widths = []
          for row in rows:
              assert row["decision_id"]
              assert row["candidate_id"]
              assert row["assumptions"]["rules_version"] != "unknown"
              assert row["assumptions"]["opponent_policy_computed_once_from_pre_turn_state"] is True
              estimate = row["target_estimate"]
              coverage = estimate["labeled_weight_fraction"]
              lower = estimate["full_mixture_lower_bound"]
              upper = estimate["full_mixture_upper_bound"]
              assert 0.0 <= coverage <= 1.0
              assert -1.0 <= lower <= upper <= 1.0, estimate
              assert "best_response_value_lower_bound" in estimate
              assert "best_response_value_upper_bound" in estimate
              widths.append(upper - lower)

          mean_width = sum(widths) / len(widths)
          summary = (
              f"## Counterfactual benchmark: {case_id}\n\n"
              f"- Candidates: {manifest['candidate_count']}\n"
              f"- Fully labeled: {manifest['fully_labeled_candidates']}\n"
              f"- Partially labeled: {manifest['partially_labeled_candidates']}\n"
              f"- Unlabeled: {manifest['unlabeled_candidates']}\n"
              f"- Mean full-mixture interval width: {mean_width:.3f}\n"
              f"- Opponent weighting: `{manifest['opponent_weight_semantics']}`\n"
              f"- Continuation mixture: `{manifest['continuation_mixture_version']}`\n"
          )
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as handle:
              handle.write(summary)
          print(json.dumps(manifest, indent=2, sort_keys=True))
          PY

      - name: Upload benchmark case
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: counterfactual-${{ matrix.case_id }}-${{ github.run_number }}
          path: artifacts/${{ matrix.case_id }}/
          if-no-files-found: warn
          retention-days: 14