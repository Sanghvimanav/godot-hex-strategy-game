name: Counterfactual Benchmark

on:
  workflow_dispatch:
  push:
    branches:
      - "ai/benchmark-correctness-ranking-metrics"
    paths:
      - ".github/workflows/counterfactual-benchmark.yml"
      - "hex-strategy-game/src/simulation/pure_state_counterfactual_*.gd"
      - "hex-strategy-game/tests/test_pure_state_counterfactual_benchmark.gd"
      - "hex-strategy-game/tests/run_tests.gd"
      - "hex-strategy-game/tools/counterfactual_benchmark.*"
      - "hex-strategy-game/tools/run_counterfactual_benchmark.sh"

permissions:
  contents: read

concurrency:
  group: counterfactual-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Benchmark ${{ matrix.case_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
# Full review matrix covers all named scenario-construction cases; the fast/full split follows.
        include:
          - case_id: smoke
            preset: smoke
            decision_id: ""
          - case_id: collapse-zerg
            preset: starter
            decision_id: cf-collapse-zerg
          - case_id: baneling-finish-zerg
            preset: starter
            decision_id: cf-baneling-finish-zerg
          - case_id: marine-spread-terran
            preset: starter
            decision_id: cf-marine-spread-terran
          - case_id: review-sacrifice
            preset: human_review
            decision_id: review-sacrifice-baneling
          - case_id: review-preservation
            preset: human_review
            decision_id: review-preserve-wounded-scout
          - case_id: review-spreading
            preset: human_review
            decision_id: review-spread-marine-screen
          - case_id: review-retreating
            preset: human_review
            decision_id: review-retreat-wounded-marine
          - case_id: review-trapped-zergling
            preset: human_review
            decision_id: review-trapped-zergling-last-kill
          - case_id: review-production-pressure
            preset: human_review
            decision_id: review-attack-zerg-production-early
          - case_id: review-coordinated-commitment
            preset: human_review
            decision_id: review-coordinate-fire-lanes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Godot 4.6
        uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: 4.6.0
          use-dotnet: false
          include-templates: false

      - name: Import Godot project
        working-directory: hex-strategy-game
        run: godot --headless --import

      - name: Run benchmark case
        shell: bash
        env:
          CASE_ID: ${{ matrix.case_id }}
          PRESET: ${{ matrix.preset }}
          DECISION_ID: ${{ matrix.decision_id }}
        run: |
          set -euo pipefail
          out="${GITHUB_WORKSPACE}/artifacts/${CASE_ID}"
          args=(--preset="${PRESET}" --out="${out}")
          if [[ -n "${DECISION_ID}" ]]; then
            args+=(--decision-id="${DECISION_ID}")
          fi
          cd hex-strategy-game
          timeout 15m bash tools/run_counterfactual_benchmark.sh "${args[@]}"

      - name: Audit benchmark case
        env:
          CASE_ID: ${{ matrix.case_id }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          case_id = os.environ["CASE_ID"]
          root = Path("artifacts") / case_id
          manifest = json.loads((root / "manifest.json").read_text())
          rows = [json.loads(line) for line in (root / "candidates.jsonl").read_text().splitlines() if line.strip()]
          assert manifest["decisions_failed"] == 0, manifest
          assert manifest["decisions_requested"] == 1, manifest
          assert manifest["candidate_count"] == len(rows), (manifest, len(rows))
          assert manifest["candidate_count"] > 0, manifest
          assert manifest["target_semantics"] == "policy_conditional_terminal_return_estimate"
          assert manifest["turn_limit_is_unlabeled"] is True
          for row in rows:
              assert row["decision_id"]
              assert row["candidate_id"]
              assert row["assumptions"]["rules_version"] != "unknown"
              coverage = row["target_estimate"]["labeled_weight_fraction"]
              assert 0.0 <= coverage <= 1.0

          summary = (
              f"## Counterfactual benchmark: {case_id}\n\n"
              f"- Candidates: {manifest['candidate_count']}\n"
              f"- Fully labeled: {manifest['fully_labeled_candidates']}\n"
              f"- Partially labeled: {manifest['partially_labeled_candidates']}\n"
              f"- Unlabeled: {manifest['unlabeled_candidates']}\n"
              f"- Opponent mixture: `{manifest['opponent_mixture_version']}`\n"
              f"- Continuation mixture: `{manifest['continuation_mixture_version']}`\n"
          )
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as handle:
              handle.write(summary)
          print(json.dumps(manifest, indent=2, sort_keys=True))
          PY

      - name: Upload benchmark case
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: counterfactual-${{ matrix.case_id }}-${{ github.run_number }}
          path: artifacts/${{ matrix.case_id }}/
          if-no-files-found: warn
          retention-days: 14

  tests:
    name: Full Godot test suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Godot 4.6
        uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: 4.6.0
          use-dotnet: false
          include-templates: false
      - name: Import Godot project
        working-directory: hex-strategy-game
        run: godot --headless --import
      - name: Run full suite
        run: timeout 10m godot --headless --path hex-strategy-game res://tests/test_runner.tscn
