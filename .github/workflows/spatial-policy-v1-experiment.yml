name: Spatial Policy V1 Experiment

on:
  workflow_dispatch:
  push:
    branches: [ai/spatial-policy-v1]
    paths: [.github/spatial-policy-v1-trigger]

permissions:
  contents: read
  actions: read

concurrency:
  group: spatial-policy-v1-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_RUN_ID: '34784986112'

jobs:
  candidate_train:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mcts-policy-baseline
          path: baseline-artifact
          repository: Sanghvimanav/godot-hex-strategy-game
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Audit frozen training inputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          decisions_path = Path('baseline-artifact/combined/search_decisions.jsonl')
          examples_path = Path('baseline-artifact/combined/examples.jsonl')
          assert decisions_path.exists(), decisions_path
          assert examples_path.exists(), examples_path
          rows = [json.loads(x) for x in decisions_path.read_text().splitlines() if x.strip()]
          examples = [json.loads(x) for x in examples_path.read_text().splitlines() if x.strip()]
          assert len(rows) == 144, len(rows)
          assert examples, 'cold-start backbone requires frozen value examples'
          assert all(not r.get('mcts_visit_distribution') for r in rows), 'V1 architecture isolation must use robust supervision only'
          rotations = {r.get('source', {}).get('rotation_steps') for r in rows}
          assert rotations <= {0, 2, 4}, rotations
          print(json.dumps({
              'robust_decisions': len(rows),
              'value_examples': len(examples),
              'training_rotations': sorted(x for x in rotations if x is not None),
              'initialization': 'cold_start',
          }))
          PY
      - name: Train fresh value backbone from frozen data
        run: |
          mkdir -p artifacts/candidate
          python -m ml.value_model.train \
            --data=baseline-artifact/combined/examples.jsonl \
            --output=artifacts/candidate/fresh_value_model.pt \
            --encoder-version=3 --epochs=25 --batch-size=32 \
            --hidden-channels=16 --residual-blocks=1 \
            --split-key=source.rotation_steps --validation-fraction=0
      - name: Train spatial entity policy V1 from fresh backbone
        run: |
          python -m ml.value_model.train_joint_plan_policy \
            --base-checkpoint=artifacts/candidate/fresh_value_model.pt \
            --search-decisions=baseline-artifact/combined/search_decisions.jsonl \
            --output=artifacts/candidate/spatial_policy_v1_model.pt \
            --epochs=25 --validation-fraction=0.2 --seed=0 --device=cpu
      - name: Audit cold-start architecture and runtime
        run: |
          python - <<'PY'
          import json, subprocess, torch
          from pathlib import Path
          checkpoint = torch.load('artifacts/candidate/spatial_policy_v1_model.pt', map_location='cpu', weights_only=False)
          config = checkpoint['joint_plan_policy_config']
          metrics = checkpoint['joint_plan_policy_metrics']
          training = checkpoint['joint_plan_training_config']
          assert config['version'] == 3, config
          assert config['architecture'] == 'spatial_entity_attention_v1', config
          assert config['explicit_action_mechanics'] is False, config
          assert metrics['robust_distillation_decisions'] == 144, metrics
          assert metrics['mcts_visit_decisions'] == 0, metrics
          assert training['backbone_frozen'] is True, training
          assert training['base_checkpoint'] == 'artifacts/candidate/fresh_value_model.pt', training
          proc = subprocess.run(
              ['python', 'hex-strategy-game/tools/neural_value_runtime.py', '--checkpoint', 'artifacts/candidate/spatial_policy_v1_model.pt'],
              input='', text=True, capture_output=True, timeout=20,
          )
          ready = json.loads(proc.stdout.splitlines()[0])
          assert ready.get('ready') is True, (ready, proc.stderr)
          assert ready.get('joint_plan_policy') is True, ready
          assert ready.get('joint_plan_policy_spatial_entities') is True, ready
          initialization = {
              'mode': 'cold_start',
              'source_run_id': 34784986112,
              'source_data_reused': True,
              'source_checkpoint_weights_reused': False,
              'value_backbone': 'random_init_then_trained_in_this_run',
              'spatial_policy_head': 'random_init_then_trained_in_this_run',
              'value_training_epochs': 25,
              'policy_training_epochs': 25,
              'seed': 0,
          }
          Path('artifacts/candidate/policy_metrics.json').write_text(json.dumps(metrics, indent=2) + '\n')
          Path('artifacts/candidate/runtime_ready.json').write_text(json.dumps(ready, indent=2) + '\n')
          Path('artifacts/candidate/initialization.json').write_text(json.dumps(initialization, indent=2) + '\n')
          print(json.dumps({'initialization': initialization, 'runtime': ready, 'metrics': metrics}, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spatial-policy-v1-candidate
          path: artifacts/candidate/
          retention-days: 30

  candidate_m2z1:
    needs: candidate_train
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: spatial-policy-v1-candidate
          path: candidate-artifact
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: 4.6.0
          use-dotnet: false
          include-templates: false
      - name: Import Godot project
        working-directory: hex-strategy-game
        run: godot --headless --import
      - name: Held-out 2M1Z robust vs MCTS-2
        working-directory: hex-strategy-game
        run: |
          godot --headless --path . res://tools/m2z1_puct_diagnostic.tscn -- \
            --puct-simulations=16 --puct-max-depth=3 \
            --checkpoint="$GITHUB_WORKSPACE/candidate-artifact/spatial_policy_v1_model.pt" \
            --out="$GITHUB_WORKSPACE/artifacts/candidate_m2z1.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spatial-policy-v1-m2z1
          path: artifacts/candidate_m2z1.json
          retention-days: 30

  evaluate_random:
    needs: candidate_train
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: spatial-policy-v1-candidate
          path: candidate-artifact
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: 4.6.0
          use-dotnet: false
          include-templates: false
      - name: Import Godot project
        working-directory: hex-strategy-game
        run: godot --headless --import
      - name: Held-out random arena
        working-directory: hex-strategy-game
        run: |
          godot --headless --path . res://tools/basic_random_arena.tscn -- \
            --mode=random --pair-count=36 --decision-time-budget-ms=5000 \
            --learned-proposals=true \
            --checkpoint="$GITHUB_WORKSPACE/candidate-artifact/spatial_policy_v1_model.pt" \
            --rules-version="$GITHUB_SHA" --runner-type=ubuntu-latest \
            --shard-index=${{ matrix.shard }} --shard-count=3 \
            --out="$GITHUB_WORKSPACE/artifacts/evaluation"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spatial-policy-v1-random-${{ matrix.shard }}
          path: artifacts/evaluation/
          retention-days: 30

  evaluate_counterfactual:
    needs: candidate_train
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: spatial-policy-v1-candidate
          path: candidate-artifact
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: 4.6.0
          use-dotnet: false
          include-templates: false
      - name: Import Godot project
        working-directory: hex-strategy-game
        run: godot --headless --import
      - name: Held-out fixed counterfactual arena
        working-directory: hex-strategy-game
        run: |
          godot --headless --path . res://tools/basic_random_arena.tscn -- \
            --mode=counterfactual --decision-time-budget-ms=5000 \
            --learned-proposals=true \
            --checkpoint="$GITHUB_WORKSPACE/candidate-artifact/spatial_policy_v1_model.pt" \
            --rules-version="$GITHUB_SHA" --runner-type=ubuntu-latest \
            --shard-index=${{ matrix.shard }} --shard-count=3 \
            --out="$GITHUB_WORKSPACE/artifacts/evaluation"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spatial-policy-v1-counterfactual-${{ matrix.shard }}
          path: artifacts/evaluation/
          retention-days: 30

  report:
    needs: [candidate_train, candidate_m2z1, evaluate_random, evaluate_counterfactual]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: spatial-policy-v1-candidate
          path: candidate
      - uses: actions/download-artifact@v4
        with:
          pattern: spatial-policy-v1-random-*
          path: random-shards
      - uses: actions/download-artifact@v4
        with:
          pattern: spatial-policy-v1-counterfactual-*
          path: counterfactual-shards
      - uses: actions/download-artifact@v4
        with:
          name: spatial-policy-v1-m2z1
          path: diagnostics/candidate
      - uses: actions/download-artifact@v4
        with:
          name: mcts-policy-baseline-m2z1
          path: diagnostics/baseline
          repository: Sanghvimanav/godot-hex-strategy-game
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Merge and summarize
        run: |
          python hex-strategy-game/tools/merge_ai_arena.py --input-root random-shards --out artifacts/random
          python hex-strategy-game/tools/merge_ai_arena.py --input-root counterfactual-shards --out artifacts/counterfactual
          python - <<'PY'
          import json
          from pathlib import Path
          random = json.loads(Path('artifacts/random/manifest.json').read_text())
          cf = json.loads(Path('artifacts/counterfactual/manifest.json').read_text())
          baseline = json.loads(Path('diagnostics/baseline/baseline_m2z1.json').read_text())
          candidate = json.loads(Path('diagnostics/candidate/candidate_m2z1.json').read_text())
          metrics = json.loads(Path('candidate/policy_metrics.json').read_text())
          initialization = json.loads(Path('candidate/initialization.json').read_text())
          summary = {
              'source_run_id': 34784986112,
              'architecture': 'spatial_entity_attention_v1',
              'explicit_action_mechanics': False,
              'initialization': initialization,
              'training': metrics,
              'reference_random': {'neural': 30, 'handwritten': 27, 'unresolved': 15},
              'reference_counterfactual': {'neural': 12, 'handwritten': 6, 'unresolved': 0},
              'candidate_random': {
                  'counts': random['counts'],
                  'family_counts': random['family_counts'],
                  'faction_counts': random.get('challenger_faction_counts', {}),
                  'pair_counts': random.get('pair_counts', {}),
              },
              'candidate_counterfactual': {
                  'counts': cf['counts'],
                  'family_counts': cf['family_counts'],
              },
              'm2z1': {
                  'baseline_robust_terran_wins': baseline['robust_terran_wins'],
                  'baseline_mcts_terran_wins': baseline['puct_terran_wins'],
                  'candidate_robust_terran_wins': candidate['robust_terran_wins'],
                  'candidate_mcts_terran_wins': candidate['puct_terran_wins'],
              },
          }
          Path('artifacts/spatial_policy_v1_summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          print(json.dumps(summary, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spatial-policy-v1-report
          path: artifacts/
          retention-days: 30
