name: AI Arena

on:
  workflow_dispatch:
    inputs:
      preset:
        description: Frozen Arena set
        required: true
        default: fast
        type: choice
        options: [smoke, fast, full]
      champion_search_budget:
        description: Champion search budget
        required: true
        default: 4x4
        type: choice
        options: [2x2, 4x4, 6x6, 8x8]
      challenger_search_budget:
        description: Challenger search budget
        required: true
        default: 4x4
        type: choice
        options: [2x2, 4x4, 6x6, 8x8]
      champion_evaluator:
        description: Champion leaf evaluator
        required: true
        default: handwritten
        type: choice
        options: [handwritten, neural]
      challenger_evaluator:
        description: Challenger leaf evaluator
        required: true
        default: neural
        type: choice
        options: [handwritten, neural]
      checkpoint_artifact_id:
        description: Exact Actions artifact ID containing the neural checkpoint (preferred for reproducibility)
        required: false
        default: ""
        type: string
      checkpoint_run_id:
        description: Actions run ID to search for the checkpoint when artifact ID is not known
        required: false
        default: ""
        type: string
      checkpoint_filename:
        description: Checkpoint filename inside the selected artifact/run
        required: true
        default: ranked_value_model.pt
        type: string
  pull_request:
    paths:
      - "hex-strategy-game/src/battle/ai/**"
      - "hex-strategy-game/src/simulation/pure_state_*.gd"
      - "!hex-strategy-game/src/simulation/pure_state_counterfactual_*.gd"
      - "!hex-strategy-game/src/simulation/pure_state_search_decision_data.gd"
      - "hex-strategy-game/tools/ai_arena.*"
      - "hex-strategy-game/tools/neural_value_runtime.py"
      - "hex-strategy-game/tools/merge_ai_arena.py"
      - "hex-strategy-game/tools/deterministic_shard.gd"
      - "ml/value_model/**"
      - "!ml/value_model/merge_search_decisions.py"
      - "!ml/value_model/ranking.py"
      - "!ml/value_model/train_ranked.py"

permissions:
  contents: read
  actions: read

concurrency:
  group: ai-arena-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-neural-checkpoint:
    name: Resolve neural checkpoint
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      checkpoint_source: ${{ steps.source.outputs.checkpoint_source }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        if: github.event_name == 'pull_request' || inputs.champion_evaluator == 'neural' || inputs.challenger_evaluator == 'neural'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU PyTorch
        if: github.event_name == 'pull_request' || inputs.champion_evaluator == 'neural' || inputs.challenger_evaluator == 'neural'
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Resolve manual checkpoint source
        id: source
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ inputs.checkpoint_artifact_id }}
          SOURCE_RUN_ID: ${{ inputs.checkpoint_run_id }}
          CHECKPOINT_FILENAME: ${{ inputs.checkpoint_filename }}
          CHAMPION_EVALUATOR: ${{ inputs.champion_evaluator }}
          CHALLENGER_EVALUATOR: ${{ inputs.challenger_evaluator }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/source artifacts/neural_checkpoint

          if [[ "$CHAMPION_EVALUATOR" != "neural" && "$CHALLENGER_EVALUATOR" != "neural" ]]; then
            echo "checkpoint_source=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -n "$ARTIFACT_ID" && -n "$SOURCE_RUN_ID" ]]; then
            echo "Provide checkpoint_artifact_id OR checkpoint_run_id, not both" >&2
            exit 1
          fi
          if [[ -z "$ARTIFACT_ID" && -z "$SOURCE_RUN_ID" ]]; then
            echo "A neural Arena run requires checkpoint_artifact_id or checkpoint_run_id" >&2
            exit 1
          fi

          if [[ -n "$ARTIFACT_ID" ]]; then
            gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > /tmp/checkpoint.zip
            unzip -q /tmp/checkpoint.zip -d artifacts/source
            CHECKPOINT_SOURCE="artifact:${ARTIFACT_ID}/${CHECKPOINT_FILENAME}"
          else
            mapfile -t artifact_ids < <(
              gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts?per_page=100" \
                --jq '.artifacts[] | select(.expired == false) | .id'
            )
            if [[ ${#artifact_ids[@]} -eq 0 ]]; then
              echo "No unexpired artifacts found for run ${SOURCE_RUN_ID}" >&2
              exit 1
            fi
            found=""
            for candidate_id in "${artifact_ids[@]}"; do
              rm -rf artifacts/source/*
              gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${candidate_id}/zip" > /tmp/checkpoint.zip
              unzip -q /tmp/checkpoint.zip -d artifacts/source
              found="$(find artifacts/source -type f -name "$CHECKPOINT_FILENAME" -print -quit)"
              if [[ -n "$found" ]]; then
                ARTIFACT_ID="$candidate_id"
                break
              fi
            done
            if [[ -z "$found" ]]; then
              echo "Could not find ${CHECKPOINT_FILENAME} in artifacts from run ${SOURCE_RUN_ID}" >&2
              exit 1
            fi
            CHECKPOINT_SOURCE="run:${SOURCE_RUN_ID}/artifact:${ARTIFACT_ID}/${CHECKPOINT_FILENAME}"
          fi

          checkpoint="$(find artifacts/source -type f -name "$CHECKPOINT_FILENAME" -print -quit)"
          if [[ -z "$checkpoint" ]]; then
            echo "Could not find ${CHECKPOINT_FILENAME} in selected artifact" >&2
            exit 1
          fi
          cp "$checkpoint" artifacts/neural_checkpoint/objective_aware_candidate_v1.pt
          printf '%s\n' "$CHECKPOINT_SOURCE" > artifacts/neural_checkpoint/checkpoint_source.txt
          echo "checkpoint_source=$CHECKPOINT_SOURCE" >> "$GITHUB_OUTPUT"
          echo "Using $CHECKPOINT_SOURCE"

      - name: Download frozen PR training artifact
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_ARTIFACT_ID: "9979426623"
        run: |
          set -euo pipefail
          mkdir -p artifacts/source
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip" > /tmp/value-model-source.zip
          unzip -q /tmp/value-model-source.zip -d artifacts/source
          test -s artifacts/source/self_play/examples.jsonl

      - name: Retrain frozen PR checkpoint
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          mkdir -p artifacts/neural_checkpoint
          python -m ml.value_model.train \
            --data artifacts/source/self_play/examples.jsonl \
            --output artifacts/neural_checkpoint/objective_aware_candidate_v1.pt \
            --epochs 60 \
            --batch-size 64 \
            --learning-rate 0.0003 \
            --weight-decay 0.0001 \
            --validation-fraction 0.25 \
            --split-key source.base_scenario_id \
            --seed 0 \
            --device cpu | tee artifacts/neural_checkpoint/training_metrics.json
          echo 'legacy-pr-training:artifact:9979426623' > artifacts/neural_checkpoint/checkpoint_source.txt
          echo 'checkpoint_source=legacy-pr-training:artifact:9979426623' >> "$GITHUB_OUTPUT"

      - name: Verify checkpoint matches current encoder
        if: github.event_name == 'pull_request' || inputs.champion_evaluator == 'neural' || inputs.challenger_evaluator == 'neural'
        run: |
          python - <<'PY'
          import torch
          from ml.value_model.data import HexStateEncoder

          path = 'artifacts/neural_checkpoint/objective_aware_candidate_v1.pt'
          checkpoint = torch.load(path, map_location='cpu', weights_only=True)
          encoder = HexStateEncoder()
          config = checkpoint['model_config']
          assert config['board_channels'] == encoder.board_channels
          assert config['global_features'] == encoder.global_features
          assert config['board_size'] == encoder.board_size
          assert config['max_radius'] == encoder.max_radius
          assert config['unit_types'] == list(encoder.unit_types)
          print(
              f"checkpoint compatible: {encoder.board_channels} board channels, "
              f"{encoder.global_features} global features"
          )
          PY

      - name: Upload resolved neural checkpoint
        if: github.event_name == 'pull_request' || inputs.champion_evaluator == 'neural' || inputs.challenger_evaluator == 'neural'
        uses: actions/upload-artifact@v4
        with:
          name: neural-leaf-checkpoint-${{ github.run_id }}
          path: artifacts/neural_checkpoint/
          if-no-files-found: error
          retention-days: 3

  fast-arena:
    if: github.event_name == 'pull_request'
    needs: prepare-neural-checkpoint
    name: Fast 2x2 neural vs handwritten shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      SHARD_COUNT: 4
      ARENA_PRESET: fast
      CHAMPION_PROFILE: fast
      CHALLENGER_PROFILE: fast
      CHAMPION_EVALUATOR: handwritten
      CHALLENGER_EVALUATOR: neural

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python for neural evaluator
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch for neural evaluator
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Download neural checkpoint
        uses: actions/download-artifact@v4
        with:
          name: neural-leaf-checkpoint-${{ github.run_id }}
          path: hex-strategy-game/models
      - name: Set up Godot 4.6
        uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: 4.6.0
          use-dotnet: false
          include-templates: false
      - name: Cache imported game assets
        uses: actions/cache@v4
        with:
          path: hex-strategy-game/.godot/imported
          key: godot-arena-imports-${{ runner.os }}-${{ hashFiles('hex-strategy-game/**/*.png', 'hex-strategy-game/**/*.jpg', 'hex-strategy-game/**/*.jpeg', 'hex-strategy-game/**/*.svg', 'hex-strategy-game/**/*.wav', 'hex-strategy-game/**/*.ogg') }}
      - name: Import Godot project
        working-directory: hex-strategy-game
        run: godot --headless --import
      - name: Run paired arena shard
        run: |
          set -euo pipefail
          mkdir -p artifacts/arena
          cd hex-strategy-game
          godot --headless --path . res://tools/ai_arena.tscn -- \
            --preset="${ARENA_PRESET}" \
            --champion-profile="${CHAMPION_PROFILE}" \
            --challenger-profile="${CHALLENGER_PROFILE}" \
            --champion-evaluator="${CHAMPION_EVALUATOR}" \
            --challenger-evaluator="${CHALLENGER_EVALUATOR}" \
            --rules-version="${GITHUB_SHA}" \
            --out="${GITHUB_WORKSPACE}/artifacts/arena" \
            --shard-index="${{ matrix.shard }}" \
            --shard-count="${SHARD_COUNT}"
      - name: Upload fast arena shard
        uses: actions/upload-artifact@v4
        with:
          name: ai-arena-fast-shard-${{ matrix.shard }}
          path: artifacts/arena/
          if-no-files-found: error
          retention-days: 3

  merge-fast:
    if: github.event_name == 'pull_request'
    name: Merge fast 2x2 neural vs handwritten arena
    needs: [prepare-neural-checkpoint, fast-arena]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Download fast arena shards
        uses: actions/download-artifact@v4
        with:
          pattern: ai-arena-fast-shard-*
          path: artifacts/arena_shards
          merge-multiple: false
      - name: Audit and summarize tournament
        run: |
          python3 hex-strategy-game/tools/merge_ai_arena.py \
            --input-root artifacts/arena_shards \
            --out artifacts/arena_merged \
            --checkpoint-source="${{ needs.prepare-neural-checkpoint.outputs.checkpoint_source }}"
          cat artifacts/arena_merged/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload merged fast arena
        uses: actions/upload-artifact@v4
        with:
          name: ai-arena-fast-${{ github.run_number }}
          path: artifacts/arena_merged/
          if-no-files-found: error
          retention-days: 14

  manual-arena:
    if: github.event_name == 'workflow_dispatch'
    needs: prepare-neural-checkpoint
    name: ${{ inputs.challenger_search_budget }} Arena shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      SHARD_COUNT: 8
      ARENA_PRESET: ${{ inputs.preset }}
      CHAMPION_BUDGET: ${{ inputs.champion_search_budget }}
      CHALLENGER_BUDGET: ${{ inputs.challenger_search_budget }}
      CHAMPION_EVALUATOR: ${{ inputs.champion_evaluator }}
      CHALLENGER_EVALUATOR: ${{ inputs.challenger_evaluator }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve search budgets
        run: |
          set -euo pipefail
          profile_for_budget() {
            case "$1" in
              2x2) echo fast ;;
              4x4) echo balanced ;;
              6x6) echo wide ;;
              8x8) echo broad ;;
              *) echo "Unknown search budget: $1" >&2; exit 1 ;;
            esac
          }
          echo "CHAMPION_PROFILE=$(profile_for_budget "$CHAMPION_BUDGET")" >> "$GITHUB_ENV"
          echo "CHALLENGER_PROFILE=$(profile_for_budget "$CHALLENGER_BUDGET")" >> "$GITHUB_ENV"
      - name: Set up Python for neural evaluator
        if: inputs.champion_evaluator == 'neural' || inputs.challenger_evaluator == 'neural'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch for neural evaluator
        if: inputs.champion_evaluator == 'neural' || inputs.challenger_evaluator == 'neural'
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Download resolved neural checkpoint
        if: inputs.champion_evaluator == 'neural' || inputs.challenger_evaluator == 'neural'
        uses: actions/download-artifact@v4
        with:
          name: neural-leaf-checkpoint-${{ github.run_id }}
          path: hex-strategy-game/models
      - name: Set up Godot 4.6
        uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: 4.6.0
          use-dotnet: false
          include-templates: false
      - name: Cache imported game assets
        uses: actions/cache@v4
        with:
          path: hex-strategy-game/.godot/imported
          key: godot-arena-imports-${{ runner.os }}-${{ hashFiles('hex-strategy-game/**/*.png', 'hex-strategy-game/**/*.jpg', 'hex-strategy-game/**/*.jpeg', 'hex-strategy-game/**/*.svg', 'hex-strategy-game/**/*.wav', 'hex-strategy-game/**/*.ogg') }}
      - name: Import Godot project
        working-directory: hex-strategy-game
        run: godot --headless --import
      - name: Run frozen mirrored arena
        run: |
          set -euo pipefail
          mkdir -p artifacts/arena
          cd hex-strategy-game
          godot --headless --path . res://tools/ai_arena.tscn -- \
            --preset="${ARENA_PRESET}" \
            --champion-profile="${CHAMPION_PROFILE}" \
            --challenger-profile="${CHALLENGER_PROFILE}" \
            --champion-evaluator="${CHAMPION_EVALUATOR}" \
            --challenger-evaluator="${CHALLENGER_EVALUATOR}" \
            --rules-version="${GITHUB_SHA}" \
            --out="${GITHUB_WORKSPACE}/artifacts/arena" \
            --shard-index="${{ matrix.shard }}" \
            --shard-count="${SHARD_COUNT}"
      - name: Upload arena shard
        uses: actions/upload-artifact@v4
        with:
          name: ai-arena-manual-shard-${{ matrix.shard }}
          path: artifacts/arena/
          if-no-files-found: error
          retention-days: 3

  merge-manual:
    if: github.event_name == 'workflow_dispatch'
    name: Merge manual Arena
    needs: [prepare-neural-checkpoint, manual-arena]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Download Arena shards
        uses: actions/download-artifact@v4
        with:
          pattern: ai-arena-manual-shard-*
          path: artifacts/arena_shards
          merge-multiple: false
      - name: Audit and summarize tournament
        run: |
          python3 hex-strategy-game/tools/merge_ai_arena.py \
            --input-root artifacts/arena_shards \
            --out artifacts/arena_merged \
            --checkpoint-source="${{ needs.prepare-neural-checkpoint.outputs.checkpoint_source }}"
          cat artifacts/arena_merged/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload merged Arena
        uses: actions/upload-artifact@v4
        with:
          name: ai-arena-${{ inputs.preset }}-${{ inputs.challenger_search_budget }}-${{ github.run_number }}
          path: artifacts/arena_merged/
          if-no-files-found: error
          retention-days: 14
