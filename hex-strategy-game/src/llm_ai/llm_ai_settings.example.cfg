[llm_ai]
base_url=https://api.openai.com/v1
model=
api_key=
# Chat: max_completion_tokens. Responses API: max_output_tokens (includes hidden reasoning)—often need 8k+ for planning.
planning_max_tokens=2048
# If true, planning uses POST /v1/responses with reasoning.effort (OpenAI thinking / GPT-5 family). Requires a provider that implements this endpoint.
use_responses_api=false
# Only when use_responses_api=true: none, minimal, low, medium, high, xhigh (model-dependent).
reasoning_effort=medium
# When true, each opponent planning call writes the full user JSON to user://llm_planning_logs/ (game state only; no API key).
log_planning_payloads=true
